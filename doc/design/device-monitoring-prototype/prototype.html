const names={A:'设备总表',B:'告警优先工作台',C:'分组巡检'};
const params=new URLSearchParams(location.search);
const state={variant:names[params.get('variant')]?params.get('variant'):'A',group:'全部设备',filter:'all',search:'',type:'全部类型',collect:'all',severity:'all',suppressed:false,selected:new Set(),detail:null,tab:'overview',metricSearch:'',updated:'尚未手动刷新'};
const $=s=>document.querySelector(s);
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isActive=d=>!d.disabled&&!d.maintenance;
const problems=d=>d.disabled||(!state.suppressed&&d.maintenance)?[]:d.problems;
const age=d=>d.last===null?'暂无数据':d.last<60?`${d.last} 秒前`:`${Math.floor(d.last/60)} 分钟前`;
const counts=list=>({all:list.length,problem:list.filter(d=>problems(d).length).length,offline:list.filter(d=>isActive(d)&&d.ping==='down').length,collection:list.filter(d=>isActive(d)&&d.collect==='down').length,maintenance:list.filter(d=>d.maintenance||d.disabled).length});
function filtered(){return devices.filter(d=>(state.group==='全部设备'||d.group===state.group)&&(!state.search||[d.name,d.ip,d.template,d.group].join(' ').toLowerCase().includes(state.search.toLowerCase()))&&(state.type==='全部类型'||d.type===state.type)&&(state.collect==='all'||d.collect===state.collect)&&(state.severity==='all'||problems(d).some(p=>p.level===state.severity))&&(state.filter==='all'||state.filter==='problem'&&problems(d).length||state.filter==='offline'&&isActive(d)&&d.ping==='down'||state.filter==='collection'&&isActive(d)&&d.collect==='down'||state.filter==='maintenance'&&(d.maintenance||d.disabled)));}

function availability(d,kind){const v=d[kind],label=v==='up'?'可达':v==='down'?'不可达':'未知';const text=kind==='ping'?label:d.protocol;const explanation=d.disabled?'监控已停用；未进行检测':d.maintenance?'维护期间；本示例无当前检测结果':kind==='ping'?`ICMP ${label}`:v==='up'?'采集成功，数据在预期周期内':v==='down'?`${d.protocol} 采集失败；不等同于设备不可达`:'尚未获得采集结果';return `<span class="badge ${v==='up'?'good':v==='down'?'bad':''}" title="${explanation}"><span class="dot"></span>${text}</span>`;}
function issueBadges(d){const ps=problems(d);if(!ps.length)return `<span class="muted small">${d.disabled?'已停用':d.maintenance?'已抑制':'—'}</span>`;return ['critical','warning'].map(level=>{const n=ps.filter(p=>p.level===level).length;return n?`<button class="link" data-open="${d.id}" data-tab="problems" aria-label="${d.name} ${level==='critical'?'严重':'警告'} ${n} 条">${badge(`${level==='critical'?'严重':'警告'} ${n}`,level==='critical'?'bad':'warn')}</button>`:'';}).join(' ');}
function deviceTitle(d){return `<div class="device-cell"><span class="device-icon">${d.type==='服务器'?'▥':d.type==='数据库'?'▱':'▤'}</span><div><button class="link device-name" data-open="${d.id}">${d.name}</button><div class="device-sub">${d.type} · ${d.group}</div></div></div>`;}
function resource(v){return v===null?'<span class="muted" title="无新鲜数据，不显示旧数值">—</span>':`<div class="resource"><span>${v}<span class="muted"> %</span></span><div class="resource-bar"><i class="${v>=80?'high':''}" style="width:${v}%"></i></div></div>`;}
function controls(){return `<div class="filters"><label class="search"><span class="filter-label">搜索设备</span><input id="search" style="width:100%" placeholder="设备名称、IP、模板或业务组" value="${escapeHTML(state.search)}"></label><label class="filter-control"><span class="filter-label">设备类型</span><select id="type">${['全部类型','服务器','交换机','路由器','防火墙','数据库','存储'].map(x=>`<option ${state.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="filter-control"><span class="filter-label">采集状态</span><select id="collect">${[['all','全部状态'],['up','采集正常'],['down','采集异常'],['unknown','未知']].map(([v,n])=>`<option value="${v}" ${state.collect===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="filter-control"><span class="filter-label">告警级别</span><select id="severity">${[['all','全部级别'],['critical','严重'],['warning','警告']].map(([v,n])=>`<option value="${v}" ${state.severity===v?'selected':''}>${n}</option>`).join('')}</select></label><button id="reset" style="align-self:end">重置</button></div><div class="filter-extra"><span>当前范围：<strong>${state.group}</strong>　/　${({all:'全部状态',problem:'有告警',offline:'设备不可达',collection:'采集异常',maintenance:'维护 / 停用'})[state.filter]}</span><label class="row"><input id="suppressed" type="checkbox" ${state.suppressed?'checked':''}>显示维护中被抑制的告警</label></div>`;}
function stats(){const c=counts(devices.filter(d=>state.group==='全部设备'||d.group===state.group));return `<div class="summary">${[['all','设备总数','▤'],['problem','有告警设备','!'],['offline','设备不可达','↯'],['collection','采集异常','⌁'],['maintenance','维护 / 停用','◷']].map(([key,name,icon])=>`<button class="stat ${state.filter===key?'active':''}" data-filter="${key}"><div><span class="small muted">${name}</span><div class="value">${String(c[key]).padStart(2,'0')}</div></div><span class="symbol">${icon}</span></button>`).join('')}</div>`;}
function groups(){return `<aside class="panel group-panel"><h3>设备分组</h3>${['全部设备','核心业务','上海数据中心','北京数据中心','办公网络'].map((g,i)=>`<button class="group ${state.group===g?'active':''}" data-group="${g}"><span>${i?'⌑':'▦'}　${g}</span><span>${devices.filter(d=>!i||d.group===g).length}</span></button>`).join('')}<div class="group-note">状态口径<br>可达性：ICMP 探测<br>采集状态：协议与数据新鲜度<br>告警：当前未恢复事件<br><br>统计卡按分组统计；<br>表格叠加下方筛选条件。</div></aside>`;}
function table(list){return `<div class="panel">${controls()}${state.selected.size?`<div class="maintenance-strip">已选择 ${state.selected.size} 台<button id="maintain">进入维护（模拟）</button><button id="unmaintain">退出维护（模拟）</button><button class="link" id="clear-selection">取消选择</button></div>`:''}<div class="table-toolbar"><div class="row"><strong>设备列表</strong><span class="muted small">${list.length} 台设备</span></div><div class="legend"><span><span class="dot" style="color:var(--green)"></span>正常</span><span><span class="dot" style="color:var(--red)"></span>异常</span><span><span class="dot" style="color:#a3acbb"></span>未知</span></div></div><div class="table-scroll"><table><thead><tr><th><input id="select-all" type="checkbox" aria-label="选择当前筛选下全部设备" ${list.length&&list.every(d=>state.selected.has(d.id))?'checked':''}></th><th>设备名称 / 分组</th><th>接口 / 模板</th><th>可达性 / 采集</th><th>当前告警</th><th>CPU</th><th>内存</th><th>最近采集</th><th>监控入口</th></tr></thead><tbody>${list.map(d=>`<tr><td><input type="checkbox" data-select="${d.id}" aria-label="选择 ${d.name}" ${state.selected.has(d.id)?'checked':''}></td><td>${deviceTitle(d)}${d.maintenance?'<div class="device-sub">◷ 维护中 · 告警抑制</div>':''}${d.disabled?'<div class="device-sub">监控已停用</div>':''}</td><td><span class="mono">${d.ip}</span><div class="device-sub">${d.template}</div></td><td>${availability(d,'ping')}<div class="protocols">${availability(d,'collect')}</div></td><td>${issueBadges(d)}</td><td>${resource(d.cpu)}</td><td>${resource(d.mem)}</td><td><span class="${d.collect==='down'?'badge warn':'muted small'}">${age(d)}</span></td><td><div class="actions">${[['metrics','数据'],['graphs','图表'],['dashboards','仪表盘']].map(([tab,label])=>`<button class="link" data-open="${d.id}" data-tab="${tab}">${label}</button>`).join('')}</div><div class="device-sub">${d.items} 个监控项</div></td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">没有符合条件的设备。请调整筛选或点击“重置”。</div>':''}</div><div class="table-foot"><span>共 ${list.length} 台 · 全部显示</span><span>模拟快照 · 最近手动刷新：${state.updated}</span></div></div>`;}
function VariantA(list){return `<div class="workspace">${groups()}${table(list)}</div>`;}
function incidentCard(d,p){return `<article class="incident"><div class="row between"><div class="row">${badge(p.level==='critical'?'严重':'警告',p.level==='critical'?'bad':'warn')}<span class="muted small">持续 ${p.duration}</span>${d.maintenance?badge('维护抑制'):''}</div><span class="small muted">${p.ack?'已确认':'待确认'}</span></div><div class="incident-title">${p.text}</div><div class="description">${d.name} · ${d.ip}　当前值 ${p.value}</div><div class="row between"><button class="link" data-open="${d.id}" data-tab="problems">查看事件与设备 →</button><button data-ack="${d.id}" ${p.ack?'disabled':''}>${p.ack?'已确认':'确认（模拟）'}</button></div></article>`;}
function VariantB(list){const incidents=list.flatMap(d=>problems(d).map(p=>({d,p}))).sort((a,b)=>Number(b.p.level==='critical')-Number(a.p.level==='critical'));return `<div class="attention row between"><div><strong>先处理影响，再定位设备</strong><div class="subtitle">当前筛选有 ${incidents.length} 条告警，${incidents.filter(x=>!x.p.ack).length} 条待确认。确认仅表示已接手，事件仍保持未恢复。</div></div>${badge('告警优先','bad')}</div><div class="panel" style="margin-bottom:16px">${controls()}</div><div class="incident-layout"><section class="panel"><div class="panel-heading row between"><h2>待关注事件</h2><span class="muted small">严重优先</span></div><div class="incident-list">${incidents.map(({d,p})=>incidentCard(d,p)).join('')||'<div class="empty">当前筛选下没有告警事件</div>'}</div></section><section class="panel"><div class="panel-heading row between"><h2>设备上下文</h2><span class="muted small">${list.length} 台</span></div>${list.map(d=>`<div class="fleet-row"><div>${deviceTitle(d)}<div class="protocols">${availability(d,'ping')}${availability(d,'collect')}</div></div><div>${issueBadges(d)}<div class="device-sub" style="text-align:right">${age(d)}</div></div></div>`).join('')||'<div class="empty">无匹配设备</div>'}</section></div>`;}
function VariantC(list){const gs=[...new Set(list.map(d=>d.group))];return `<div class="panel" style="margin-bottom:16px">${controls()}</div><div class="variant-intro"><h2>按分组逐一巡检</h2><span class="small muted">可达性、采集、告警分开判断</span></div><div class="cluster-layout">${gs.map(g=>{const ds=list.filter(d=>d.group===g),c=counts(ds);return `<section class="panel"><div class="cluster-heading"><div><h2>${g}</h2><div class="subtitle">${ds.length} 台设备 · ${c.problem} 台有告警 · ${c.collection} 台采集异常</div></div><button class="link" data-drill="${g}">查看列表 →</button></div><div class="cluster-meter">${ds.map(d=>`<i style="flex:1" class="${!isActive(d)?'gray':problems(d).length?'red':''}" title="${d.name}：${!isActive(d)?'维护或停用':problems(d).length?'有告警':'无告警'}"></i>`).join('')}</div>${ds.map(d=>`<div class="mini-device"><div>${deviceTitle(d)}<div class="device-sub mono" style="padding-left:40px">${d.ip}</div></div><div class="right">${issueBadges(d)}<div class="protocols">${availability(d,'ping')}${availability(d,'collect')}</div></div></div>`).join('')}</section>`;}).join('')||'<div class="panel empty">无匹配分组，请重置筛选。</div>'}</div>`;}
function render(){const list=filtered();$('#app').innerHTML=`<div class="page-heading row between"><div><div class="eyebrow">INFRASTRUCTURE / MONITORING</div><h1>设备监控</h1><p class="subtitle">从设备状态到问题定位，让每一次巡检都有落点。</p></div><div class="row"><span class="muted small">快照模式</span><button id="refresh">↻ 刷新快照</button><button class="primary" id="how">设计说明</button></div></div>${stats()}${({A:VariantA,B:VariantB,C:VariantC})[state.variant](list)}`;$('#switcher').innerHTML=`<div class="switcher"><div class="row between"><button data-cycle="-1" aria-label="上一个设计方案">←</button><span class="current">${state.variant} · ${names[state.variant]}${state.variant==='A'?'（推荐）':''}</span><button data-cycle="1" aria-label="下一个设计方案">→</button></div><div class="state">模拟 / 内存状态 · 分组 ${state.group} · 匹配 ${list.length}/${devices.length} · 已选 ${state.selected.size}</div></div>`;wire();}
function variant(v){state.variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState({},'',u);render();}
function cycle(n){const keys=Object.keys(names);variant(keys[(keys.indexOf(state.variant)+n+3)%3]);}
function toast(text){$('#notifications').innerHTML=`<div class="toast">${escapeHTML(text)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#notifications').innerHTML='',3200);}
function wire(){document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{state.filter=el.dataset.filter;render();});document.querySelectorAll('[data-group]').forEach(el=>el.onclick=()=>{state.group=el.dataset.group;state.selected.clear();render();});document.querySelectorAll('[data-cycle]').forEach(el=>el.onclick=()=>cycle(Number(el.dataset.cycle)));document.querySelectorAll('[data-drill]').forEach(el=>el.onclick=()=>{state.group=el.dataset.drill;variant('A');});document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openDetail(Number(el.dataset.open),el.dataset.tab||'overview'));document.querySelectorAll('[data-ack]').forEach(el=>el.onclick=()=>{devices.find(d=>d.id===Number(el.dataset.ack)).problems.forEach(p=>p.ack=true);render();toast('已模拟确认；事件仍未恢复');});document.querySelectorAll('[data-select]').forEach(el=>el.onchange=()=>{const id=Number(el.dataset.select);el.checked?state.selected.add(id):state.selected.delete(id);render();});const search=$('#search');search.oninput=()=>{const pos=search.selectionStart;state.search=search.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);};['type','collect','severity'].forEach(k=>$('#'+k).onchange=e=>{state[k]=e.target.value;render();});$('#suppressed').onchange=e=>{state.suppressed=e.target.checked;render();};$('#reset').onclick=()=>{Object.assign(state,{filter:'all',search:'',type:'全部类型',collect:'all',severity:'all',suppressed:false});state.selected.clear();render();};$('#refresh').onclick=()=>{state.updated=new Date().toLocaleTimeString('zh-CN',{hour12:false});render();toast('已刷新模拟快照；未请求真实设备');};$('#how').onclick=showDesign;if($('#select-all'))$('#select-all').onchange=e=>{filtered().forEach(d=>e.target.checked?state.selected.add(d.id):state.selected.delete(d.id));render();};if($('#clear-selection'))$('#clear-selection').onclick=()=>{state.selected.clear();render();};['maintain','unmaintain'].forEach(k=>{if($('#'+k))$('#'+k).onclick=()=>{devices.filter(d=>state.selected.has(d.id)).forEach(d=>d.maintenance=k==='maintain');state.selected.clear();render();toast(k==='maintain'?'所选设备已进入模拟维护，告警保留并抑制':'所选设备已退出模拟维护');};});}
function chart(d){if(!d.trend.length)return '<div class="empty">当前无可用的新鲜数据，不绘制趋势。</div>';const pts=d.trend.map((v,i)=>`${35+i*49},${145-v*1.2}`).join(' ');return `<svg class="chart" viewBox="0 0 610 170" role="img" aria-label="${d.name} CPU 最近一小时模拟趋势"><g class="chart-grid"><path d="M35 25H590 M35 65H590 M35 105H590 M35 145H590"/></g><g fill="#969daf" font-size="9"><text x="4" y="28">100</text><text x="10" y="68">66</text><text x="10" y="108">33</text><text x="17" y="148">0</text><text x="35" y="165">-60 分钟</text><text x="285" y="165">-30 分钟</text><text x="554" y="165">现在</text></g><polygon points="35,145 ${pts} 574,145" fill="#7047eb0c"/><polyline points="${pts}" fill="none" stroke="#9872ed" stroke-width="2.3"/></svg>`;}
function metricRows(d){return [['CPU 使用率','cpu_usage_active',d.cpu===null?'—':d.cpu+' %'],['内存使用率','mem_used_percent',d.mem===null?'—':d.mem+' %'],['ICMP 可达性','icmp_reachable',d.ping==='unknown'?'未知':d.ping==='up'?'1（可达）':'0（不可达）'],['采集状态','collection_up',d.collect==='unknown'?'未知':d.collect==='up'?'1（成功）':'0（失败）']].filter(row=>row.join(' ').toLowerCase().includes(state.metricSearch.toLowerCase()));}
function detailBody(d){if(state.tab==='overview')return `<div class="row wrap">${availability(d,'ping')}${availability(d,'collect')}${d.maintenance?badge('维护中 · 告警抑制'):d.disabled?badge('监控停用'):badge('监控启用','purple')}${issueBadges(d)}</div><div class="detail-grid"><div class="detail-tile"><span class="muted">CPU 使用率</span><strong>${d.cpu===null?'—':d.cpu+'<small> %</small>'}</strong></div><div class="detail-tile"><span class="muted">内存使用率</span><strong>${d.mem===null?'—':d.mem+'<small> %</small>'}</strong></div></div><h3>CPU 趋势 <span class="muted small">/ 最近 1 小时 · 模拟</span></h3>${chart(d)}<div class="definition"><span class="muted">监控模板</span><span>${d.template}</span><span class="muted">所属分组</span><span>${d.group}</span><span class="muted">监控项</span><span>${d.items} 项（列表仅示例 4 项）</span><span class="muted">最近采集</span><span>${age(d)}</span><span class="muted">状态解释</span><span>${d.ping==='down'?'ICMP 和采集均失败，应先检查链路与设备供电。':d.collect==='down'?'ICMP 可达，SNMP 超时；优先排查凭据、ACL 与采集器链路。':d.disabled?'监控停用，不进行健康判断。':d.maintenance?'维护期间，告警保留但抑制通知。':'设备可达、采集正常；是否有业务风险另见当前告警。'}</span></div>`;
 if(state.tab==='metrics')return `<div class="row between"><h3>最新数据</h3><span class="small muted">示例 4 / ${d.items} 个监控项</span></div><input id="metric-search" placeholder="筛选指标名称或标识" value="${escapeHTML(state.metricSearch)}" style="width:100%;margin:18px 0"><table><thead><tr><th>监控项</th><th>最新值</th><th>数据时间</th></tr></thead><tbody>${metricRows(d).map(([name,key,value])=>`<tr><td>${name}<div class="device-sub mono">${key}</div></td><td>${value}</td><td>${key==='icmp_reachable'||key==='collection_up'?'当前模拟探测':age(d)}</td></tr>`).join('')}</tbody></table><p class="subtitle">采集异常时不回填为 0；无新鲜数据的资源指标显示“—”。</p>`;
 if(state.tab==='problems')return `<h3>当前告警 · ${problems(d).length} 条</h3>${problems(d).map(p=>incidentCard(d,p)).join('')||'<div class="empty">当前无展示中的告警。维护告警可在列表勾选“显示维护中被抑制的告警”。</div>'}`;
 if(state.tab==='graphs')return `<h3>CPU 使用率 <span class="muted small">最近 1 小时 · 模拟</span></h3>${chart(d)}<p class="subtitle">趋势为示意数据。网络接口、磁盘与数据库专属图表在正式接入时按模板提供。</p>`;
 if(state.tab==='dashboards')return `<h3>关联仪表盘</h3><button class="dashboard-card" id="board"><div class="row between"><strong>▦　${d.type}运行概览</strong><span class="muted">打开示例 →</span></div><p class="subtitle">来自 ${d.template} · 已绑定 ${d.name}</p></button>`;
 return `<h3>状态记录 <span class="muted small">/ 模拟时间线</span></h3><div class="history-line">现在　${d.disabled?'监控停用':d.maintenance?'设备处于维护中':d.collect==='down'?'采集异常，正在等待恢复':'最近一次采集成功'}</div>${d.problems.map(p=>`<div class="history-line">${p.duration}前　${p.text}<br><span class="muted">${p.ack?'事件已确认':'事件待确认'} · 未恢复</span></div>`).join('')}<div class="history-line muted">1 天前　设备关联 ${d.template} 模板</div>`;}
let returnFocus=null;
function openDetail(id,tab='overview'){returnFocus=document.activeElement;state.detail=id;state.tab=tab;state.metricSearch='';renderDetail();$('#close-detail').focus();}
function closeDetail(){state.detail=null;$('#detail').innerHTML='';document.body.style.overflow='';if(returnFocus&&returnFocus.isConnected)returnFocus.focus();}
function renderDetail(){const d=devices.find(d=>d.id===state.detail);if(!d)return;document.body.style.overflow='hidden';$('#detail').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${d.name} 设备详情"><div class="drawer-header"><div class="row between"><span class="eyebrow">DEVICE DETAILS / 模拟</span><button id="close-detail" aria-label="关闭设备详情">✕</button></div><h2 style="font-size:22px;margin:12px 0">${d.name}</h2><span class="mono muted">${d.ip}　/　${d.group}</span></div><div class="drawer-tabs" role="tablist">${[['overview','概览'],['metrics','最新数据'],['problems','告警'],['graphs','图表'],['dashboards','仪表盘'],['history','记录']].map(([v,n])=>`<button role="tab" aria-selected="${state.tab===v}" data-detail-tab="${v}" class="${state.tab===v?'active':''}">${n}</button>`).join('')}</div><div class="drawer-body">${detailBody(d)}</div></section></div>`;$('#close-detail').onclick=closeDetail;$('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))closeDetail();};document.querySelectorAll('[data-detail-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.detailTab;renderDetail();$(`[data-detail-tab="${state.tab}"]`).focus();});document.querySelectorAll('#detail [data-open]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab||'overview';renderDetail();});document.querySelectorAll('#detail [data-ack]').forEach(el=>el.onclick=()=>{d.problems.forEach(p=>p.ack=true);render();renderDetail();toast('已模拟确认；事件仍未恢复');});if($('#metric-search'))$('#metric-search').oninput=e=>{const pos=e.target.selectionStart;state.metricSearch=e.target.value;renderDetail();$('#metric-search').focus();$('#metric-search').setSelectionRange(pos,pos);};if($('#board'))$('#board').onclick=()=>{state.tab='graphs';renderDetail();toast('已打开关联仪表盘的 CPU 趋势示例');};}
function showDesign(){returnFocus=document.activeElement;document.body.style.overflow='hidden';$('#detail').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="监控页面设计说明"><div class="drawer-header row between"><h2>围绕值班人员的四个问题</h2><button id="close-detail" aria-label="关闭设计说明">✕</button></div><div class="drawer-body"><p style="line-height:2">哪些设备有问题？是设备不可达，还是采集失败？问题持续多久、谁在处理？在哪里查看数据并验证恢复？</p><div class="history-line"><strong>A · 设备总表（推荐默认）</strong><p class="subtitle">借鉴 Zabbix Monitoring → Hosts：高密度设备行，接口、可达性、当前告警、最新数据和图表直达。增加 CPU、内存与数据新鲜度，支持日常巡检。</p></div><div class="history-line"><strong>B · 告警优先工作台</strong><p class="subtitle">先按严重程度处理事件，再查看同屏设备上下文。适合值班与故障响应；已确认仍保留在未恢复事件中。</p></div><div class="history-line"><strong>C · 分组巡检</strong><p class="subtitle">按机房或业务分组逐块检查，适合范围明确的巡检。点击“查看列表”进入同组设备总表。</p></div><div class="history-line"><strong>状态语义</strong><p class="subtitle">ICMP 只表示网络可达性。协议采集成功不代表业务没有告警。维护抑制告警而不删除事件；停用不参与健康判断。灰色代表未知，缺失资源数据不显示为 0。状态卡统计当前分组，筛选在列表内叠加。</p></div><div class="history-line"><strong>原型边界</strong><p class="subtitle">12 台模拟设备、全部状态在内存中，刷新浏览器即复位。导航栏为上下文示意；无真实新增、配置修改或通知。尚未确定的设计不进入生产业务路由。</p></div><p class="subtitle"><a href="https://www.zabbix.com/documentation/current/en/manual/web_interface/frontend_sections/monitoring/hosts" target="_blank" rel="noopener">参考：Zabbix 官方 Hosts 视图文档 ↗</a></p></div></section></div>`;$('#close-detail').onclick=closeDetail;$('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))closeDetail();};$('#close-detail').focus();}
document.addEventListener('keydown',e=>{if($('#detail').children.length){if(e.key==='Escape'){closeDetail();e.preventDefault();}if(e.key==='Tab'){const focusable=[...$('#detail').querySelectorAll('button:not([disabled]),input,a[href]')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}return;}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){cycle(e.key==='ArrowRight'?1:-1);e.preventDefault();}});
window.addEventListener('popstate',()=>{state.variant=names[new URLSearchParams(location.search).get('variant')]?new URLSearchParams(location.search).get('variant'):'A';render();});
render();
</script>
</body>
</html>
