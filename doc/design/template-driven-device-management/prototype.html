<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>分类模板与设备接入 · 夜莺交互原型</title>
    <style>
      :root {
        font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        color: #25314a;
        background: #f5f6fa;
        font-size: 14px;
        --accent: #6c3ce8;
        --border: #e4e7ef;
        --muted: #768097;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 3px;
      }
      button,
      a {
        cursor: pointer;
      }
      button {
        border: 1px solid #dce0e9;
        border-radius: 6px;
        padding: 8px 13px;
        background: #fff;
        color: #3d4760;
      }
      button:hover {
        border-color: #ab94ef;
      }
      button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      button.link {
        border: 0;
        background: transparent;
        color: var(--accent);
        padding: 4px 7px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      input,
      select,
      textarea {
        border: 1px solid #dbe0ea;
        border-radius: 6px;
        padding: 9px 10px;
        background: white;
        min-width: 0;
        color: #26324a;
        width: 100%;
      }
      textarea {
        resize: vertical;
        line-height: 1.65;
      }
      input[type="checkbox"] {
        width: auto;
        accent-color: var(--accent);
      }
      code {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        background: #f1eef9;
        padding: 2px 5px;
        border-radius: 4px;
      }
      .app {
        display: grid;
        grid-template-columns: 178px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        background: #fff;
        border-right: 1px solid var(--border);
        padding: 24px 12px;
      }
      .brand {
        font-size: 19px;
        font-weight: 700;
        padding: 0 8px 32px;
        letter-spacing: 0.3px;
      }
      .brand b {
        color: var(--accent);
      }
      .side-label {
        font-size: 11px;
        color: #939aad;
        margin: 25px 12px 10px;
        letter-spacing: 1px;
      }
      .side-item {
        display: block;
        border: 0;
        background: transparent;
        width: 100%;
        text-align: left;
        padding: 12px;
        border-radius: 7px;
        margin: 3px 0;
      }
      .side-item.active {
        background: #f0eaff;
        color: var(--accent);
        font-weight: 600;
      }
      .side-item small {
        font-size: 11px;
        color: #969eb0;
        margin-left: 4px;
      }
      .sidebar .hint {
        font-size: 12px;
        line-height: 1.8;
        color: #858da0;
        margin: 30px 10px;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        height: 60px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #7e879b;
      }
      .topbar span {
        font-size: 12px;
      }
      .prototype-note {
        background: #fff8e8;
        border-bottom: 1px solid #f0e6ce;
        padding: 10px 28px;
        color: #896b26;
        line-height: 1.7;
        font-size: 12px;
      }
      .page {
        padding: 25px 28px 35px;
      }
      .page-title {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: start;
        margin-bottom: 21px;
      }
      h1 {
        font-size: 24px;
        font-weight: 650;
        margin: 0 0 9px;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 14px;
      }
      h3 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      p {
        line-height: 1.8;
        margin: 7px 0;
      }
      .subtle {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.75;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fff;
        padding: 21px;
        min-width: 0;
      }
      .catalog-layout {
        display: grid;
        grid-template-columns: 254px minmax(0, 1fr);
        gap: 18px;
      }
      .category-panel {
        padding: 16px 10px;
        max-height: calc(100vh - 220px);
        overflow: auto;
      }
      .category-panel h3 {
        padding: 0 9px;
        margin-bottom: 14px;
      }
      .tree-tools {
        display: flex;
        gap: 12px;
        padding: 0 9px 12px;
        margin-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }
      .tree-tools button {
        font-size: 12px;
        padding: 2px 0;
      }
      .tree-row {
        display: flex;
        gap: 3px;
        align-items: center;
        border-radius: 5px;
        min-height: 35px;
      }
      .tree-row.selected {
        background: #efe9ff;
        color: var(--accent);
      }
      .tree-row > button:first-child {
        padding: 3px 4px;
        border: 0;
        background: transparent;
        width: 22px;
        font-size: 12px;
        color: #7d8598;
      }
      .tree-name {
        flex: 1;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 7px 2px;
        font-size: 13px;
        min-width: 0;
      }
      .tree-count {
        font-size: 11px;
        color: #9aa2b4;
        margin-right: 7px;
      }
      .path {
        font-size: 12px;
        color: #7f889c;
        line-height: 1.8;
      }
      .catalog-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .catalog-toolbar input {
        max-width: 310px;
        flex: 1 1 200px;
      }
      .catalog-toolbar select {
        max-width: 140px;
      }
      .catalog-main {
        min-width: 0;
      }
      .device-type-section {
        margin-bottom: 24px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--border);
      }
      .device-cascade {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin: 14px 0 8px;
      }
      .inline-template {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 15px;
        padding: 12px;
        border-radius: 7px;
        background: #f8f5ff;
      }
      .inline-template .template-heading {
        margin: 0;
      }
      .catalog-controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .display-toggle {
        display: flex;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: white;
      }
      .display-toggle button {
        border: 0;
        background: transparent;
        padding: 6px 10px;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .display-toggle button.active {
        color: #7042ed;
        background: #f1ebff;
      }
      .display-toggle svg {
        width: 15px;
        height: 15px;
      }
      .template-heading {
        display: flex;
        gap: 13px;
        align-items: center;
        min-width: 0;
        margin-bottom: 12px;
      }
      .template-heading h3 {
        margin: 3px 0 4px;
      }
      .template-logo {
        position: relative;
        flex: 0 0 48px;
        width: 48px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #e9ecf3;
        border-radius: 9px;
        background: #fafbfe;
        overflow: hidden;
        vertical-align: middle;
      }
      .template-logo img {
        position: absolute;
        width: 100%;
        height: 100%;
        padding: 7px;
        object-fit: contain;
        background: #fafbfe;
      }
      .template-logo .logo-fallback {
        font-size: 18px;
        font-weight: 600;
        color: #7950bd;
      }
      .template-logo.small {
        flex-basis: 36px;
        width: 36px;
        height: 36px;
        border-radius: 7px;
      }
      .template-logo.small img {
        padding: 5px;
      }
      .template-list {
        background: white;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .template-list table {
        min-width: 850px;
      }
      .template-list th {
        background: #f8f9fc;
      }
      .template-list td {
        vertical-align: middle;
      }
      .template-list .template-heading {
        margin-bottom: 0;
      }
      .template-list .template-name {
        color: #253349;
        font-weight: 600;
        max-width: 245px;
      }
      .template-list tr.selected {
        background: #faf7ff;
      }
      .icon-editor {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        border: 1px solid #e6e9f2;
        border-radius: 8px;
        background: #fafbfe;
        padding: 16px;
      }
      .icon-editor .template-logo {
        background: white;
      }
      .icon-editor .icon-editor-content {
        min-width: 0;
        flex: 1;
      }
      .icon-editor .actions {
        margin: 8px 0;
      }
      .icon-library {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 9px;
        margin: 12px 0 20px;
      }
      .icon-choice {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        padding: 12px 6px;
        font-size: 12px;
        min-width: 0;
      }
      .icon-choice.selected {
        border-color: #7950bd;
        background: #f8f4ff;
      }
      .icon-import-preview {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 14px;
        padding: 12px;
        background: #f7f8fc;
        border-radius: 7px;
      }
      .icon-import-preview .icon-description {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .icon-file-label {
        display: block;
        border: 1px dashed #c7bcdf;
        padding: 18px;
        border-radius: 7px;
        margin: 10px 0;
        background: #fcfaff;
      }
      .icon-file-label input {
        margin-top: 10px;
        width: 100%;
        border: 0;
        padding: 0;
        height: auto;
        background: transparent;
      }
      #icon-source {
        font-size: 12px;
      }
      #icon-error {
        color: #c43838;
        font-size: 12px;
        margin: 8px 0;
      }
      .template-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }
      .template-card {
        position: relative;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        min-height: 158px;
        min-width: 0;
      }
      .template-card:hover {
        background: #fff;
        border-color: var(--accent);
      }
      .template-card-main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 32px 12px 24px;
        height: 100%;
        min-height: 158px;
        color: #253349;
        text-decoration: none;
        border-radius: inherit;
      }
      .template-card-main:hover {
        color: #253349;
        text-decoration: none;
      }
      .template-card-main:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .template-card-name {
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
        overflow-wrap: anywhere;
      }
      .template-card .template-logo {
        width: 72px;
        height: 42px;
        flex: 0 0 42px;
        border: 0;
        border-radius: 0;
        background: transparent;
      }
      .template-card .template-logo img {
        padding: 0;
        background: transparent;
      }
      .template-card .template-logo:has(img:not([hidden])) .logo-fallback {
        visibility: hidden;
      }
      .template-card-operations {
        position: absolute;
        top: 6px;
        right: 6px;
        display: flex;
        gap: 2px;
        opacity: 0;
        pointer-events: none;
      }
      .template-card:hover .template-card-operations,
      .template-card:focus-within .template-card-operations {
        opacity: 1;
        pointer-events: auto;
      }
      .template-icon-button {
        width: 26px;
        height: 26px;
        padding: 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        color: #7651d2;
      }
      .template-icon-button svg {
        width: 16px;
        height: 16px;
      }
      .template-icon-button:hover {
        background: #e9e5f3;
      }
      .template-icon-button.delete {
        color: #d34a4a;
      }
      .template-icon-button.delete:hover {
        background: #fde9e7;
      }
      button.danger {
        color: #d34a4a;
        border-color: #e8b5b5;
        background: #fff8f7;
      }
      @media (hover: none) {
        .template-card-operations {
          opacity: 1;
          pointer-events: auto;
        }
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        line-height: 1.7;
        padding: 2px 8px;
        border-radius: 4px;
        background: #eef5ff;
        color: #4571ab;
        margin-right: 5px;
      }
      .tag.green {
        background: #eaf7f0;
        color: #258354;
      }
      .tag.orange {
        background: #fff3e6;
        color: #b77923;
      }
      .tag.purple {
        background: #f0eaff;
        color: #7950bd;
      }
      .template-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
        padding-top: 13px;
        border-top: 1px solid #f0f1f5;
      }
      .meta-line {
        font-size: 12px;
        color: #7a8498;
        margin-top: 13px;
      }
      .guide {
        border: 1px solid #ded6f1;
        background: #faf8ff;
        border-radius: 8px;
        padding: 12px 16px;
        margin: 0 0 21px;
      }
      .guide summary {
        cursor: pointer;
        color: #6849a0;
        font-weight: 500;
      }
      .guide p {
        font-size: 12px;
        color: #85759f;
      }
      .guide .actions {
        margin-top: 12px;
      }
      .guide button {
        font-size: 12px;
      }
      .editor-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 275px;
        gap: 18px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--border);
        margin: -3px -2px 21px;
        overflow: auto;
      }
      .tabs button {
        white-space: nowrap;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: transparent;
        padding: 12px 14px;
        font-size: 13px;
      }
      .tabs button.active {
        color: var(--accent);
        border-color: var(--accent);
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 22px;
      }
      .field label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
      }
      .field label.required:before {
        content: "*";
        color: #cf5a60;
        margin-right: 4px;
      }
      .field .help {
        color: #8991a1;
        font-size: 12px;
        line-height: 1.6;
        margin-top: 6px;
      }
      .full {
        grid-column: 1/-1;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        background: #f8f9fc;
        color: #818ba0;
        font-weight: 500;
        font-size: 12px;
        text-align: left;
      }
      th,
      td {
        padding: 12px 10px;
        border-bottom: 1px solid #edf0f5;
        vertical-align: top;
      }
      td input,
      td select {
        padding: 6px 8px;
      }
      .compact {
        font-size: 12px;
      }
      .info {
        border: 1px solid #e1d9f7;
        background: #f8f5ff;
        border-radius: 7px;
        padding: 12px 14px;
        color: #74549d;
        line-height: 1.75;
        font-size: 12px;
        margin-bottom: 18px;
      }
      .warn {
        border-color: #eedbb8;
        background: #fffaf0;
        color: #957338;
      }
      .error {
        border-color: #edc5ca;
        background: #fff4f5;
        color: #aa4c59;
      }
      .success {
        border-color: #c9e6d8;
        background: #f0faf4;
        color: #3d8763;
      }
      .kv {
        margin: 0;
      }
      .kv > div {
        padding: 10px 0;
        border-bottom: 1px solid #f0f1f5;
      }
      .kv dt {
        color: #8a93a5;
        font-size: 12px;
        margin-bottom: 5px;
      }
      .kv dd {
        margin: 0;
        font-size: 13px;
        line-height: 1.75;
        overflow-wrap: anywhere;
      }
      .section-title {
        margin: 26px 0 15px;
        font-size: 14px;
        font-weight: 600;
      }
      .steps {
        display: flex;
        gap: 8px;
        margin: 0 0 25px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        color: #8e96a8;
        font-size: 13px;
        padding: 13px 10px;
        border-bottom: 2px solid #e6e9f0;
      }
      .step i {
        font-style: normal;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        background: #e9ecf3;
        font-size: 12px;
      }
      .step.active {
        color: var(--accent);
        border-color: var(--accent);
      }
      .step.active i {
        background: var(--accent);
        color: white;
      }
      .wizard-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 286px;
        gap: 18px;
      }
      .wizard-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #edf0f5;
        padding-top: 20px;
        margin-top: 25px;
      }
      .credential-note {
        font-size: 12px;
        color: #8490a4;
        margin: 0 0 17px;
      }
      .scope-check {
        display: flex;
        gap: 10px;
        align-items: start;
        padding: 12px 0;
        border-bottom: 1px solid #edf0f5;
      }
      .scope-check input {
        margin-top: 4px;
      }
      .scope-check div {
        flex: 1;
      }
      .mock-chart {
        height: 116px;
        display: flex;
        gap: 11px;
        align-items: flex-end;
        padding: 14px 15px;
        background: #f8f7fc;
        border-radius: 7px;
        margin-top: 17px;
      }
      .mock-chart i {
        display: block;
        background: #c8b8ec;
        flex: 1;
        border-radius: 3px 3px 0 0;
      }
      .dashboard-mini {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .dashboard-mini > div {
        padding: 15px;
        border: 1px solid #e7e2f1;
        border-radius: 6px;
        font-size: 12px;
      }
      .state {
        margin-top: 22px;
        background: #eef1f7;
        border-radius: 7px;
        padding: 13px 17px;
        color: #69778f;
        font-size: 12px;
      }
      .state summary {
        cursor: pointer;
      }
      .state-content {
        display: flex;
        gap: 12px 28px;
        flex-wrap: wrap;
        margin-top: 13px;
      }
      .state-content b {
        color: #445069;
        font-weight: 500;
      }
      .device-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 18px;
      }
      .progress {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin: 17px 0 20px;
      }
      .progress > div {
        padding: 13px 10px;
        border-radius: 6px;
        background: #f4f6fa;
        font-size: 12px;
        text-align: center;
        color: #8a93a5;
      }
      .progress > div.done {
        background: #eaf7ef;
        color: #40835d;
      }
      .empty {
        padding: 60px 20px;
        color: #8c94a5;
        text-align: center;
      }
      .toast {
        position: fixed;
        top: 19px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: #26324a;
        color: #fff;
        z-index: 50;
        border-radius: 7px;
        box-shadow: 0 6px 22px #2431552b;
        max-width: 80vw;
        font-size: 13px;
      }
      dialog {
        border: 1px solid #e0e4ed;
        border-radius: 12px;
        padding: 0;
        width: min(700px, 94vw);
        color: #25314a;
        box-shadow: 0 20px 80px #1a23383b;
      }
      dialog::backdrop {
        background: #1d273f52;
      }
      .modal-head {
        padding: 20px 25px;
        border-bottom: 1px solid var(--border);
        font-size: 18px;
        font-weight: 600;
      }
      .modal-body {
        padding: 24px;
      }
      .modal-foot {
        padding: 15px 24px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 9px;
      }
      .report-list {
        margin: 8px 0;
        padding-left: 21px;
        line-height: 2;
      }
      .readable {
        max-width: 1120px;
      }
      .notice-inline {
        font-size: 12px;
        color: #926f35;
        margin-top: 7px;
      }
      .version-diff {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin: 15px 0;
      }
      .version-diff > div {
        background: #f7f8fb;
        border-radius: 6px;
        padding: 15px;
      }
      .nowrap {
        white-space: nowrap;
      }
      @media (min-width: 1750px) {
        .template-grid {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }
      @media (max-width: 1200px) {
        .sidebar {
          padding: 20px 8px;
        }
        .app {
          grid-template-columns: 150px minmax(0, 1fr);
        }
        .editor-layout,
        .wizard-layout,
        .device-layout {
          grid-template-columns: 1fr;
        }
        .right-summary {
          order: 2;
        }
        .page {
          padding: 20px;
        }
        .catalog-layout {
          grid-template-columns: 220px minmax(0, 1fr);
        }
        .template-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .category-panel {
          max-height: 700px;
        }
      }
      @media (max-width: 760px) {
        .app {
          display: block;
        }
        .sidebar {
          display: none;
        }
        .page {
          padding: 16px;
        }
        .topbar {
          padding: 0 16px;
        }
        .prototype-note {
          padding: 10px 16px;
        }
        .catalog-layout {
          display: block;
        }
        .category-panel {
          max-height: 260px;
          margin-bottom: 15px;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .page-title {
          flex-wrap: wrap;
        }
        .steps {
          flex-wrap: wrap;
        }
        .step {
          flex-basis: 40%;
        }
        .progress {
          grid-template-columns: 1fr 1fr;
        }
        .template-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .catalog-toolbar {
          flex-wrap: wrap;
        }
        .catalog-controls {
          width: 100%;
          justify-content: space-between;
        }
        .device-cascade {
          grid-template-columns: 1fr;
        }
        .icon-library {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .version-diff {
          grid-template-columns: 1fr;
        }
        .dashboard-mini {
          grid-template-columns: 1fr;
        }
      }
    </style>

      async function decodeIcon(source, name, serial) {

            source
          )
        )
          throw new Error(
            "请提供图片的 HTTP(S) URL 或图片 Base64，或选择本地图片。"
          );
        if (source.startsWith("data:") && source.length > 2 * 1024 * 1024 * 1.4)
          throw new Error("图标不能超过 2 MB。");
        const img = new Image();
        img.src = source;
        await img.decode();
        if (!$("#modal").open || serial !== iconReadSerial) return;
        iconPending = { logo: source, name };
        $("#icon-error").textContent = "";
        updateIconPreview();

        updateIconPreview();

        try {

            source,

        $('[data-action="icon-save"]').disabled = true;
        $("#icon-error").textContent = "正在读取本地图片…";
        try {
          if (file.size > 2 * 1024 * 1024)

          if (!/\.(png|jpe?g|svg|webp)$/i.test(file.name))

          clone ? "基于当前模板新建" : "新建模板草稿",
          '<div class="form-grid"><div class="field full"><label>基础包</label><select id="new-base">' +
            state.templates
              .map(
                (x) =>
                  '<option value="' +
                  x.id +
                  '" ' +
                  (x.id === state.ui.template ? "selected" : "") +
                  ">" +
                  e(x.draft.name) +
                  "</option>"
              )
              .join("") +
            '</select></div><div class="field full"><label>模板名称</label><input id="new-name" placeholder="填写要创建的模板名称"></div><div class="field full"><label>设备分类</label><select id="new-category">' +
            categoryOptions(
              state.ui.category === "all"
                ? t()?.draft.category || "mysql80"
                : state.ui.category
            ) +
            '</select></div></div><p class="subtle">新包独立编辑，不改变基础包；草稿发布后才可用于添加设备。</p>',
          "new-save",
          "创建草稿"
        );
      }
      function fieldModal(index = -1) {
        const f =
          index >= 0
            ? t().draft.fields[index]
            : { label: "", key: "", type: "text", required: true, default: "" };
        modal(
          index >= 0 ? "编辑表单字段" : "新增表单字段",
          '<div class="form-grid"><input type="hidden" id="field-index" value="' +
            index +
            '"><div class="field"><label>显示名称</label><input id="field-label" value="' +
            e(f.label) +
            '"></div><div class="field"><label>字段键</label><input id="field-key" value="' +
            e(f.key) +
            '" placeholder="connect_timeout"></div><div class="field"><label>控件类型</label><select id="field-type">' +
            selectOptions(
              [
                ["text", "文本"],
                ["number", "数字"],
                ["password", "密码 / 秘密"],
                ["ip", "IPv4"],
                ["url", "URL"],
                ["select", "下拉"],
              ],
              f.type
            ) +
            '</select></div><div class="field"><label>默认值（秘密字段请留空）</label><input id="field-default" value="' +
            e(f.default || "") +
            '"></div><div class="field full"><label>字段帮助</label><input id="field-help" value="' +
            e(f.help || "") +
            '"></div><div class="field full"><label>下拉选项（每行一个，适用于下拉控件）</label><textarea id="field-options" rows="3">' +
            e(
              (f.options || [])
                .map((o) => (Array.isArray(o) ? o[0] : o))
                .join("\n")
            ) +
            '</textarea></div><div class="field"><label>显示条件字段键（首条，可留空）</label><input id="field-when" value="' +
            e(f.when?.[0]?.key || "") +
            '"></div><div class="field"><label>条件允许值（逗号分隔）</label><input id="field-values" value="' +
            e(f.when?.[0]?.values.join(",") || "") +
            '"></div><label><input id="field-required" type="checkbox" ' +
            (f.required ? "checked" : "") +
            '> 必填字段</label><p class="help full">修改首条条件时，其他条件保持不变；完整条件可在表单定义列表查看。</p></div>',
          "field-save",
          "保存到草稿"
        );
      }
      function instanceModal(id) {
        const d = state.devices.find((x) => x.id === id);
        modal(
          "只调整此设备：" + d.name,
          '<input type="hidden" id="instance-id" value="' +
            id +
            '"><div class="form-grid"><div class="field full"><label>第一条规则阈值 / 状态</label><input id="instance-threshold" value="' +
            e(d.overrides.threshold ?? d.spec.rules[0].threshold) +
            '"></div><div class="field full"><label>本设备仪表盘名称</label><input id="instance-board" value="' +
            e(d.overrides.dashboardName || d.spec.dashboardName) +
            '"></div><div class="field full"><label>本设备通知方案</label><select id="instance-notify">' +
            selectOptions(Object.entries(notifyNames), d.notify) +
            '</select></div></div><p class="subtle">保留来源版本。修改只应用本对象，不修改公共模板或同 IP 其他设备。</p>',
          "instance-save",
          "保存设备覆盖"
        );
      }
      function upgradeModal(id) {
        const d = state.devices.find((x) => x.id === id),
          r = Model.latest(Model.getTemplate(state, d.template));
        modal(
          "模板升级差异",
          '<input type="hidden" id="upgrade-id" value="' +
            id +
            '"><div class="version-diff"><div><b>当前绑定 v' +
            d.version +
            "</b><p>规则阈值 " +
            e(d.spec.rules[0].threshold) +
            "</p><p>本设备覆盖 " +
            e(d.overrides.threshold || "无") +
            "</p><p>表单 " +
            d.spec.fields.length +
            " 项</p></div><div><b>目标发布 v" +
            r.version +
            "</b><p>规则阈值 " +
            e(r.spec.rules[0].threshold) +
            "</p><p>新增设备使用此版本</p><p>表单 " +
            r.spec.fields.length +
            ' 项</p></div></div><div class="info">默认保留本设备覆盖，只升级未覆盖项。升级后进入待下发状态，仍需验证新修订指标。</div><label><input type="checkbox" id="upgrade-reset"> 同时重置本设备覆盖（显式选择才生效）</label>',
          "upgrade-save",
          "模拟应用升级"
        );
      }
      function scenario(name) {
        state.ui.guide = "";
        if (
          name === "mysql" ||
          name === "windows" ||
          name === "dell" ||
          name === "hpe"
        ) {
          const id = {
            mysql: "mysql-80",
            windows: "windows-2022",
            dell: "dell-r740",
            hpe: "hpe-dl380",
          }[name];
          choose(id, true);
          state.ui.guide = {
            mysql: "数据库 → MySQL → 8.0：表单自动显示数据库监控账号密码。",
            windows:
              "操作系统 → Windows → Server 2022：切换 SNMP v2c / v3，观察认证字段变化。",
            dell: "服务器 → 戴尔 → PowerEdge R740：填写 iDRAC 账号密码，采集方式为 Redfish。",
            hpe: "服务器 → 惠普 → DL380 Gen10：填写 iLO 账号密码，与 Dell 的设备发现映射分别维护。",
          }[name];
          render();
          return;
        }
        if (name === "field") {
          state.ui.template = "mysql-80";
          const x = t();
          if (!x.draft.fields.some((f) => f.key === "environment_note"))
            act(
              "FIELD",
              {
                index: -1,
                field: {
                  key: "environment_note",
                  label: "环境备注（新字段示例）",
                  type: "text",
                  required: false,
                  default: "生产环境",
                },
              },
              false
            );
          state.ui.guide =
            "草稿已经加入“环境备注”。点击发布新版本，再返回目录添加 MySQL 设备，观察新字段出现；未发布的草稿不会被调用。";
          go("editor", { editTab: "fields" });
          return;
        }
        if (name === "same-ip") {
          for (const [id, n] of [
            ["dell-r740", "同一服务器 · 硬件"],
            ["mysql-80", "同一服务器 · MySQL"],
          ]) {
            act("SELECT", { id, demo: true }, false);
            act(
              "FORM",
              {
                common: { name: n, asset: "asset-01" },
                params: { address: "192.0.2.40" },
              },
              false
            );
            act("ADD", {}, false);
          }
          state.ui.guide =
            "同一个 192.0.2.40 和资产-01，现在有两条独立监控绑定。分别使用 iDRAC 与数据库凭据，不按 IP 拒绝或合并。";
          go("devices");
          return;
        }
        if (name === "upgrade") {
          act("SELECT", { id: "mysql-80", demo: true }, false);
          act("FORM", { common: { name: "MySQL · 保留覆盖示例" } }, false);
          act("ADD", {}, false);
          const d = state.devices.find((x) => x.id === state.ui.device);
          act("OVERRIDE", { id: d.id, values: { threshold: "80" } }, false);
          state.ui.template = "mysql-80";
          const rules = Model.clone(t().draft.rules);
          rules[0].threshold = "95";
          act("DRAFT", { values: { rules } }, false);
          act("PUBLISH", {}, false);
          state.ui.guide =
            "已先创建旧版本设备并设独立阈值80，再发布公共新版本。设备仍固定旧版；点击“预览升级差异”，默认保留本设备覆盖。";
          go("devices", { device: d.id });
        }
      }
      document.addEventListener("input", (event) => {
        const el = event.target;
        if (el.id === "icon-source") {
          iconReadSerial++;
          iconPending = null;
          $("#icon-error").textContent = "请点击“预览此图标”确认图片。";
          updateIconPreview();
        }
        if (el.matches("[data-param]"))
          act("FORM", { params: { [el.dataset.param]: el.value } }, false);
        if (el.matches("[data-common]"))
          act("FORM", { common: { [el.dataset.common]: el.value } }, false);
        if (el.matches("[data-edit]") && el.tagName !== "SELECT") {
          act("DRAFT", { values: { [el.dataset.edit]: el.value } }, false);
        }
        if (el.matches("[data-rule-threshold],[data-rule-duration]")) {
          const rules = Model.clone(t().draft.rules),
            key =
              el.dataset.ruleThreshold !== undefined ? "threshold" : "duration",
            index = Number(el.dataset.ruleThreshold ?? el.dataset.ruleDuration);
          rules[index][key] = el.value;
          act("DRAFT", { values: { rules } }, false);
        }
        if (el.id === "catalog-search") {
          state.ui.search = el.value;
          syncURL();
          $("#catalog-cards").innerHTML = cards(state.ui.view === "add");
          renderState();
        }
      });
      document.addEventListener("change", (event) => {
        const el = event.target;
        if (el.dataset.deviceLevel !== undefined) {
          if (
            act("CASCADE", {
              level: Number(el.dataset.deviceLevel),
              value: el.value,
            })
          )
            syncURL();
          return;
        }
        if (el.id === "device-template") {
          if (el.value) choose(el.value);
          else {
            state.form.template = null;
            state.form.version = null;
            state.form.params = {};
            state.form.probe = null;
            render();
            syncURL();
          }
          return;
        }
        if (el.matches("select[data-param]")) {
          act("FORM", { params: { [el.dataset.param]: el.value } }, false);
          render();
        }
        if (el.matches("select[data-common]"))
          act("FORM", { common: { [el.dataset.common]: el.value } }, false);
        if (el.matches("select[data-edit]"))
          act("DRAFT", { values: { [el.dataset.edit]: el.value } });
        if (el.matches("[data-notify]")) {
          act("FORM", { notify: el.value }, false);
          render();
        }
        if (el.dataset.ruleEnabled !== undefined) {
          const rules = Model.clone(t().draft.rules);
          rules[Number(el.dataset.ruleEnabled)].enabled = el.checked;
          act("DRAFT", { values: { rules } }, false);
        }
        if (el.id === "catalog-status") {
          state.ui.status = el.value;
          syncURL();
          $("#catalog-cards").innerHTML = cards(state.ui.view === "add");
          renderState();
        }
      });
      document.addEventListener("click", (event) => {
        const card = event.target.closest("[data-open-template]");
        if (
          card &&
          !event.metaKey &&
          !event.ctrlKey &&
          !event.shiftKey &&
          !event.altKey
        ) {
          event.preventDefault();
          go("editor", {
            template: card.dataset.openTemplate,
            editTab: "base",
          });
          return;
        }
        const el = event.target.closest("button");
        if (!el) return;
        const d = el.dataset;
        if (d.layout) {
          state.ui.layout = d.layout;
          state.log =
            "已切换为" +
            (d.layout === "list" ? "列表" : "卡片") +
            "模式，分类、搜索与筛选保持不变。";
          syncURL();
          render();
          return;
        }
        if (d.iconChoice) {
          selectIcon(iconLibrary.find((i) => i.id === d.iconChoice));
          return;
        }
        if (d.view) {
          if (d.view === "templates") state.ui.status = "all";
          go(d.view);
          return;
        }
        if (d.category) {
          state.ui.category = d.category;
          state.ui.search = "";
          syncURL();
          render();
          return;
        }
        if (d.treeAll) {
          act("TREE_ALL", { expand: d.treeAll === "expand" });
          return;
        }
        if (d.toggle) {
          state.ui.expanded = state.ui.expanded.includes(d.toggle)
            ? state.ui.expanded.filter((x) => x !== d.toggle)
            : [...state.ui.expanded, d.toggle];
          render();
          return;
        }
        if (d.deleteTemplate) {
          deleteTemplateModal(d.deleteTemplate);
          return;
        }
        if (d.editTemplate) {
          basicMetadataModal(d.editTemplate);
          return;
        }
        if (d.editTab) {
          go("editor", { editTab: d.editTab });
          return;
        }
        if (d.scenario) {
          scenario(d.scenario);
          return;
        }
        if (d.fieldEdit !== undefined) {
          fieldModal(Number(d.fieldEdit));
          return;
        }
        if (d.fieldDelete !== undefined) {
          act("DELETE_FIELD", { index: Number(d.fieldDelete) });
          return;
        }
        if (d.device) {
          go("devices", { device: d.device });
          return;
        }
        if (d.progress) {
          act("PROGRESS", { id: d.progress });
          return;
        }
        if (d.fail) {
          act("PROGRESS", { id: d.fail, fail: true });
          return;
        }
        if (d.event) {
          act("EVENT", { id: d.event });
          return;
        }
        if (d.instance) {
          instanceModal(d.instance);
          return;
        }
        if (d.upgrade) {
          upgradeModal(d.upgrade);
          return;
        }
        switch (d.action) {
          case "icon-modal":
            iconModal();
            break;
          case "icon-clear":
            act("DRAFT", { values: { logo: "", logoName: "默认占位图标" } });
            break;
          case "icon-source-preview":
            previewIconSource();
            break;
          case "icon-save":
            if (!iconPending?.logo) {
              toast("请先选择、导入或预览一张图标");
              break;
            }
            if (
              act("DRAFT", {
                values: { logo: iconPending.logo, logoName: iconPending.name },
              })
            ) {
              closeModal();
              toast("图标已应用到草稿；发布后会在模板目录和新增设备中展示。");
            }
            break;
          case "delete-template-confirm":
            if (
              act("DELETE_TEMPLATE", { id: $("#delete-template-id").value })
            ) {
              closeModal();
              syncURL();
              toast("已在当前原型中删除模板，刷新页面后恢复。");
            }
            break;
          case "back-templates":
            go("templates");
            break;
          case "category-modal":
            categoryModal();
            break;
          case "category-save":
            if (
              act("CATEGORY", {
                name: $("#category-name").value,
                parent: $("#category-parent").value || null,
              })
            ) {
              closeModal();
              toast("分类已在原型内创建");
            }
            break;
          case "new-modal":
            newModal();
            break;
          case "clone-modal":
            newModal(true);
            break;
          case "new-save": {
            const name = $("#new-name").value.trim();
            if (!name) {
              toast("请填写模板名称");
              break;
            }
            if (
              act("NEW_TEMPLATE", {
                name,
                base: $("#new-base").value,
                category: $("#new-category").value,
              })
            ) {
              closeModal();
              syncURL();
            }
            break;
          }
          case "basic-save": {
            const target=Model.getTemplate(state,$('#basic-template-id').value);
            const name=$('#basic-name').value.trim();if(!name){toast('请填写名称');break;}
            target.draft.name=name;target.draft.category=$('#basic-category').value;
            const icon=iconLibrary.find(i=>i.id===$('#basic-library').value);
            target.draft.logo=icon?.data || $('#basic-logo').value.trim();target.draft.logoName=icon?.name || '自定义图标';
            closeModal();render();toast('基本信息已保留到草稿，发布后用于新设备');break;
          }
          case "save-draft":
            state.log = "草稿已保留在本页内存；当前已发布版本和设备均未变化。";
            renderState();
            toast("草稿已保存到本页内存，刷新后重置");
            break;
          case "publish":
            if (act("PUBLISH"))
              toast("已模拟发布新版本；新增设备可以选择，已有设备保持原样。");
            break;
          case "field-new":
            fieldModal();
            break;
          case "field-save": {
            const index = Number($("#field-index").value),
              old = index >= 0 ? t().draft.fields[index] : {},
              type = $("#field-type").value,
              key = $("#field-key").value.trim(),
              label = $("#field-label").value.trim();
            if (!key || !label) {
              toast("请填写显示名称与字段键");
              break;
            }
            const when = $("#field-when").value.trim(),
              field = {
                ...old,
                key,
                label,
                type,
                required: $("#field-required").checked,
                secret: type === "password",
                default: $("#field-default").value,
                help: $("#field-help").value,
                options:
                  type === "select"
                    ? $("#field-options").value.split("\n").filter(Boolean)
                    : undefined,
                when: when
                  ? [
                      {
                        key: when,
                        values: $("#field-values")
                          .value.split(",")
                          .map((v) => v.trim())
                          .filter(Boolean),
                      },
                      ...(old.when || []).slice(1),
                    ]
                  : (old.when || []).slice(1),
              };
            if (act("FIELD", { index, field })) {
              closeModal();
            }
            break;
          }
          case "start-add":
            act("START_ADD");
            syncURL();
            break;
          case "cancel-add":
            go("devices");
            break;
          case "fill-demo": {
            const spec = Model.selectedSpec(state);
            act("FORM", {
              params: Model.demo(spec),
              common: { name: spec.name + " · 示例设备" },
            });
            break;
          }
          case "probe": {
            const errors = Model.validateForm(state, Model.selectedSpec(state));
            if (errors.length) {
              toast(errors.join(" "));
              break;
            }
            const type = $("#probe-scenario").value;
            state.form.probe = {
              ok: type === "success",
              text: {
                success:
                  "模拟通过：参数与模板要求匹配。未连接真实目标；保存后还需等待实际指标。",
                timeout:
                  "模拟连接超时：输入已保留，可保存为待采集，或修改参数后重试。",
                denied: "模拟权限不足：输入已保留，请核对目标账号权限。",
                missing:
                  "模拟缺少必需指标：连接成功不代表模板全部可用，需检查采集项 / 型号。",
              }[type],
            };
            state.log = state.form.probe.text;
            render();
            break;
          }
          case "next":
            if (state.ui.step === 2) {
              const errors = Model.validateForm(
                state,
                Model.selectedSpec(state)
              );
              if (errors.length) {
                toast(errors.join(" "));
                break;
              }
            }
            go("add", { step: Math.min(4, state.ui.step + 1) });
            break;
          case "previous":
            go("add", { step: Math.max(2, state.ui.step - 1) });
            break;
          case "add":
            if (act("ADD")) syncURL();
            break;
          case "close-modal":
            closeModal();
            break;
          case "instance-save":
            if (
              act("OVERRIDE", {
                id: $("#instance-id").value,
                values: {
                  threshold: $("#instance-threshold").value,
                  dashboardName: $("#instance-board").value,
                },
                notify: $("#instance-notify").value,
              })
            ) {
              closeModal();
            }
            break;
          case "upgrade-save":
            if (
              act("UPGRADE", {
                id: $("#upgrade-id").value,
                reset: $("#upgrade-reset").checked,
              })
            ) {
              closeModal();
            }
            break;
        }
      });
      function fromURL() {
        const p = new URLSearchParams(location.search),
          view = p.get("view"),
          id = p.get("template");
        if (id && Model.getTemplate(state, id)) {
          state.ui.template = id;
          if (view === "add")
            state = Model.reduce(state, {
              type: "SELECT",
              id,
              demo: p.get("demo") === "1",
              step: Math.min(4, Math.max(2, Number(p.get("step")) || 2)),
            });
        }
        if (["grid", "list"].includes(p.get("layout")))
          state.ui.layout = p.get("layout");
        if (p.has("q")) state.ui.search = p.get("q");
        if (["all", "draft", "published"].includes(p.get("status")))
          state.ui.status = p.get("status");
        if (["templates", "editor", "add", "devices", "design"].includes(view))
          state.ui.view = view;
        if (view === "add" && !Model.selectedSpec(state)) state.ui.step = 2;
        if (
          p.get("category") &&
          state.categories.some((c) => c.id === p.get("category"))
        )
          state.ui.category = p.get("category");
        if (
          ["base", "fields", "collection", "dashboard", "alerts"].includes(
            p.get("tab")
          )
        )
          state.ui.editTab = p.get("tab");
        render();
      }
      window.addEventListener("popstate", fromURL);
      fromURL();
    </script>
  </body>
</html>
