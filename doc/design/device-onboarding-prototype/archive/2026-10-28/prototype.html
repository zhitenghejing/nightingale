const initialState=(category='host',component)=>{const c=CATALOG.categories.find(x=>x.id===category)||CATALOG.categories[0];return {category:c.id,component:component&&c.templates.includes(component)?component:c.default,step:1,values:{},test:'尚未模拟',scenario:'成功示例',message:'选择类型与模板，表单将按采集方式变化。',boards:[],alerts:[],result:false}};
const templateOf=s=>CATALOG.templates.find(x=>x.name===s.component);
const fieldsOf=s=>{const t=templateOf(s);let fs=(SCHEMAS[t.name]||(()=>[S('mapping','拟定采集方式',['待映射','SNMP v2c','HTTP 指标接口','数据库连接','本机 Agent'])]))(s.values);if(s.values.httpAuth==='Basic Auth')fs=[...fs,F('httpUser','HTTP 用户名','monitor'),P('httpPassword','HTTP 密码')];if(s.values.httpAuth==='Bearer Token')fs=[...fs,P('httpToken','Bearer Token')];return fs};

const readiness=s=>{const t=templateOf(s);if(t.origin==='custom')return '自建模板需核对映射';if(['Skywalking','Greenplum'].includes(t.name))return '需要先补采集契约';return t.state==='现有 SNMP 接入'?'SNMP 流程已实现；此页仍为模拟':'此类接入在规划中'};
const validate=s=>{const missing=fieldsOf(s).filter(f=>f.required&&!String(s.values[f.key]??'').trim()).map(f=>f.label);if(!s.values.name)missing.unshift('对象名称');if(s.values.address&&!/^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$/.test(s.values.address))missing.push('合法 IPv4 地址');return missing};

const note=t=>TEMPLATE_NOTES[t.name]||(t.origin==='custom'?'该组件来自当前页面的自建内容。类型、参数和资源关联需要逐项确认，原型不覆盖原内容。':'表单依据现有采集示例归纳。具体的指标名、标签和权限将在接入时逐模板核对。');
function route(update=true){if(update){const u=new URL(location.href);u.searchParams.set('view',view);u.searchParams.set('type',state.category);u.searchParams.set('template',state.component);u.searchParams.set('step',state.step);history.replaceState(null,'',u)}render()}
function render(){document.body.dataset.view=view;for(const x of ['overview','form','plan'])$('tab-'+x).classList.toggle('active',x===view);$('switcher').style.display=view==='form'?'flex':'none';$('type-label').textContent=`${CATALOG.categories.find(x=>x.id===state.category).name} · ${CATALOG.categories.findIndex(x=>x.id===state.category)+1} / 16`;$('app').innerHTML=view==='overview'?overview():view==='plan'?plan():wizard();updateSummary()}
const icons=['▥','▤','◈','▣','⇄','▧','♧','⬡','▱','⌘','☁','◎','⚙','◫','◉','◇'];
function overview(){return `<div class="notice"><strong>本轮评审的问题：</strong>同一个添加入口，能否根据设备 / 服务类型，给出正确的模板与采集参数？本页为独立交互原型，所有操作都只在页面内存中演示。</div><div class="stats"><div class="stat"><strong>${CATALOG.defaultCount}</strong> 个源码默认组件</div><div class="stat"><strong>${CATALOG.liveCount-CATALOG.defaultCount}</strong> 个当前自建组件</div><div class="stat"><strong>16</strong> 类添加配置页面</div><div class="stat"><strong>4</strong> 步统一添加流程</div></div><div class="guide"><div><strong>快速体验典型场景</strong><small>SNMP 团体字 / 数据库账号 / 集群 Token / 推送通道</small></div><div class="guides">${[['host','Linux_SNMP','Linux SNMP'],['database','MySQL','MySQL'],['container','Kubernetes','Kubernetes'],['observability','RocketMQ','RocketMQ 推送']].map(([c,t,n])=>`<button data-template="${t}" data-category="${c}" data-demo="1">${n} ↗</button>`).join('')}</div></div><div class="grid">${CATALOG.categories.map((c,i)=>`<button class="type-card" data-category="${c.id}"><div class="row"><span class="type-icon">${icons[i]}</span><span class="tag">${c.templates.length} 个组件</span></div><h3>${c.name}</h3><div class="muted tiny">${c.description}</div><div class="chip-list">${c.templates.slice(0,4).map(n=>`<span class="chip">${esc(n)}</span>`).join('')}${c.templates.length>4?`<span class="chip">+${c.templates.length-4}</span>`:''}</div></button>`).join('')}</div><div class="walkthrough"><span class="muted tiny">每个类型都有独立可分享地址，可切换同类型模板查看参数差异。</span></div>`}
function wizard(){const t=templateOf(state),c=CATALOG.categories.find(x=>x.id===state.category);return `<div class="wizard"><aside class="type-nav"><div class="tiny muted" style="padding:8px 11px">设备 / 服务类型</div>${CATALOG.categories.map((cat,i)=>`<button class="${cat.id===c.id?'active':''}" data-category="${cat.id}"><span>${cat.name}</span><span class="count">${cat.templates.length}</span></button>`).join('')}</aside><section class="form-card"><div class="steps">${['类型与模板','连接与采集','应用内容','确认添加'].map((name,i)=>`<button data-step="${i+1}" class="${state.step===i+1?'active':''}"><span class="step-dot">${i+1}</span>${name}</button>${i<3?'<span class="step-line"></span>':''}`).join('')}</div><div class="form-body"><div class="section-head"><div><h2 style="margin-bottom:3px">${state.step===1?c.name:state.step===2?'填写采集要求':state.step===3?'选择模板应用内容':'确认本次添加方案'}</h2><span class="muted tiny">${state.step===1?c.description:`${esc(t.name)} · ${modeFor(t)}`}</span></div><span class="tag purple">${t.origin==='custom'?'自建待映射':t.name.endsWith('_SNMP')?'已有 SNMP 能力':'规划原型'}</span></div>${state.step===1?stepTemplates(c):state.step===2?stepConnection(t):state.step===3?stepApplication(t):stepReview(t)}</div><footer class="form-foot"><button data-action="reset">重置本页示例</button><div class="toolbar">${state.step>1?'<button data-action="back">上一步</button>':''}<button class="primary" data-action="${state.step<4?'next':'preview'}">${state.step<4?'下一步':'预览添加结果'}</button></div></footer></section><aside class="summary" id="summary"></aside></div>`}
function stepTemplates(c){return `<p class="muted tiny">先选对象对应的模板。采集方式由模板定义，不会把所有对象都要求填写成 IP + 团体字。</p><div class="template-grid">${c.templates.map(n=>{const t=CATALOG.templates.find(x=>x.name===n);return `<button class="template-option ${state.component===n?'selected':''}" data-template="${esc(n)}" data-category="${c.id}"><strong>${esc(n)} ${state.component===n?'<span style="float:right;color:var(--purple)">✓</span>':''}</strong><div class="meta">${modeFor(t)}<br>${t.origin==='custom'?'自建资源待核对':`${t.boards.length} 仪表盘 · ${t.alerts.length} 告警规则 · ${t.metricCount} 指标说明`}</div></button>`}).join('')}</div><div class="method"><span>当前匹配的采集方式</span><strong>${modeFor(templateOf(state))}</strong></div><div class="contract">${esc(note(templateOf(state)))}</div>`}
function renderField(f){const val=state.values[f.key]??'',id='field-'+f.key;return `<div class="field ${f.type==='textarea'?'wide':''}"><label for="${id}">${f.required?'<span class="required">*</span>':''}${esc(f.label)}</label>${f.type==='select'?`<select id="${id}" data-field="${f.key}"><option value="">请选择</option>${f.options.map(x=>`<option ${val===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea id="${id}" data-field="${f.key}" placeholder="${esc(f.sample)}">${esc(val)}</textarea>`:`<input id="${id}" data-field="${f.key}" type="${f.type}" value="${esc(val)}" placeholder="${f.type==='password'?'仅填写演示值':esc(f.sample)}" autocomplete="off">`}${f.help?`<div class="help">${esc(f.help)}</div>`:''}</div>`}
function stepConnection(t){const common=[F('name','对象名称',t.name.toLowerCase()+'-demo-01'),S('group','所属业务组',['Default Busi Group','应用服务组（示例）']),S('collector','执行采集器',['categraf01（示例）','目标主机 Agent（示例）']),S('interval','采集间隔（秒）',['30','15','60','120'])];return `<div class="notice">${esc(note(t))}</div><div class="form-section"><div class="section-head"><h3>基础信息</h3><button class="link-btn" data-action="examples">填入示例参数</button></div><div class="fields">${common.map(renderField).join('')}</div></div><div class="form-section"><div class="section-head"><h3>${modeFor(t)}参数</h3><span class="tiny muted">按模板动态生成</span></div><div class="fields">${fieldsOf(state).map(renderField).join('')}</div></div>${t.gaps.length?`<details><summary>现有模板的资源缺口（${t.gaps.length}）</summary><ul>${t.gaps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`:''}<div class="section-head"><h3>模拟接入校验</h3><span class="tag">无网络调用</span></div><div class="toolbar"><select id="scenario" style="max-width:215px">${['成功示例','模拟权限不足','模拟指标名不匹配','模拟采集器不可达'].map(x=>`<option ${state.scenario===x?'selected':''}>${x}</option>`).join('')}</select><button data-action="simulate">模拟校验</button></div><div id="simulation-result">${simulationHTML()}</div>`}
function simulationHTML(){if(state.test==='尚未模拟')return '<p class="muted tiny" style="margin:12px 0">校验示例只演示参数、权限和指标契约分支，不会探测真实目标。</p>';return `<div class="check-result ${state.test==='模拟通过'?'success':'error'}"><strong>${state.test}</strong><br>${esc(state.message)}</div>`}
function stepApplication(t){return `<div class="notice">应用采集定义和指标说明，并为本对象生成独立的仪表盘、告警规则实例。模板后续变化不覆盖设备定制。</div><div class="review-box"><div class="review-row"><span>采集说明 / 定义</span><span>${t.instructions?'已有说明':'待补采集说明'} · ${t.collectionEvidence?'有配置示例':'结构化映射待补'}</span></div><div class="review-row"><span>指标说明</span><span>${t.origin==='custom'?'待单独核对':t.metricCount?`${t.metricCount} 条`:'未提供独立指标说明；需要补齐或核对'}</span></div><div class="review-row"><span>对象 / 标签绑定</span><span>设备 ID + 实例标识 + 模板需要的集群 / 角色标签</span></div></div><h3>仪表盘 <span class="tag">${t.boards.length} 个备选</span></h3><p class="muted tiny">原型默认只预选 1 个。云平台、多角色组件实施时还需按产品和角色进一步筛选。</p>${resourceChecks(t.boards,'board',state.boards)}<h3 style="margin-top:22px">告警规则 <span class="tag">${t.alerts.length} 条备选</span></h3><p class="muted tiny">单实例模板预选现有规则；多产品 / 多角色组件实施时先按范围匹配。90% 持续 5 分钟只属于当前 SNMP 主机模板，其他类型遵循自身规则。通知另行配置。</p>${resourceChecks(t.alerts,'alert',state.alerts)}<details><summary>每台设备如何保留自定义</summary><p>采集参数、采集指标、仪表盘和告警规则都保存对象级配置。普通编辑保留定制；显式重新应用模板时再显示覆盖确认。</p></details>`}
function resourceChecks(rows,kind,selected){if(!rows.length)return '<div class="empty">当前没有可列出的这类源码资源；自建内容需单独核对，原型不自动补造。</div>';return `<div class="checklist">${rows.map((r,i)=>`<label><input type="checkbox" data-resource="${kind}" value="${i}" ${selected.includes(i)?'checked':''}><span>${esc(r.name)}</span></label>`).join('')}</div>`}
function stepReview(t){const counts=selectedCounts(state);if(state.result)return `<div style="text-align:center"><div class="success-icon">◇</div><h2>添加方案预览</h2><p class="muted">仅生成本页方案，没有创建设备或下发采集配置。</p></div>${reviewDetails(t,counts)}<div class="notice ${['Skywalking','Greenplum'].includes(t.name)||t.origin==='custom'?'warning':''}"><strong>${readiness(state)}</strong><br>实施后应经过：保存参数 → 发布采集配置 / 关联现有数据 → 等待真实指标 → 应用已匹配的仪表盘和规则。${!t.alerts.length?' 当前模板未提供告警，不能承诺会自动产生告警。':''}</div><button data-action="form">继续调整</button>`;return `<div class="notice warning">这是设计原型。${readiness(state)}。所有参数和结果都是待评审方案。</div>${reviewDetails(t,counts)}<p class="muted tiny">保存配置成功与采集生效分开显示。连接失败时保留输入；指标 / 标签不匹配时明确指出需要调整的模板资源。</p>`}
function reviewDetails(t,c){const safe=fieldsOf(state).map(f=>`<div class="review-row"><span>${esc(f.label)}</span><span>${f.type==='password'?(state.values[f.key]?'••••••（仅本页示例）':'未填写'):esc(state.values[f.key]||'未填写 / 模板默认')}</span></div>`).join('');return `<div class="review-box"><div class="review-row"><span>对象名称</span><strong>${esc(state.values.name||'尚未填写')}</strong></div><div class="review-row"><span>设备类型 / 模板</span><strong>${esc(t.name)}</strong></div><div class="review-row"><span>采集方式</span><span>${modeFor(t)}</span></div><div class="review-row"><span>应用内容</span><span>${c.boards} 个仪表盘 / ${c.alerts} 条告警规则（待实施）</span></div>${safe}</div>`}
function updateSummary(){const box=$('summary');if(!box)return;const t=templateOf(state),c=CATALOG.categories.find(x=>x.id===state.category),counts=selectedCounts(state);box.innerHTML=`<h3>当前添加方案</h3><div class="muted tiny">每次选择后更新；凭据不显示明文。</div><div class="kv"><span class="muted">对象类型</span><span>${c.name}</span></div><div class="kv"><span class="muted">关联模板</span><strong>${esc(t.name)}</strong></div><div class="kv"><span class="muted">采集方式</span><span>${modeFor(t)}</span></div><div class="kv"><span class="muted">接入状态</span><span class="tag orange">${t.origin==='custom'?'待映射':t.name.endsWith('_SNMP')?'已有 SNMP 能力':'拟接入'}</span></div><hr><div class="kv"><span>已选仪表盘</span><strong>${counts.boards} / ${t.boards.length}</strong></div><div class="kv"><span>已选告警规则</span><strong>${counts.alerts} / ${t.alerts.length}</strong></div><div class="kv"><span>连接校验</span><span>${esc(state.test)}</span></div><div class="state-note">${esc(state.message)}</div><details><summary>查看本页参数状态</summary><div class="current-fields">${[F('name','对象名称'),...fieldsOf(state)].map(f=>`<div><span>${esc(f.label)}</span><span>${f.type==='password'?(state.values[f.key]?'已填示例':'未填'):esc(state.values[f.key]||'未填写')}</span></div>`).join('')}</div></details><hr><h3 class="tiny">按模板生成、按对象独立调整</h3><ul><li>采集项和指标说明</li><li>独立仪表盘</li><li>独立告警与通知配置</li><li>同一采集器支持多个监控对象</li></ul><button data-action="examples" style="width:100%">填入示例参数</button><p class="tiny muted" style="margin-top:12px;margin-bottom:0">仅界面原型 · 无保存 / 无真实采集<br>模板盘点日期：${CATALOG.date}</p>`}
function plan(){const rows=CATALOG.templates.filter(t=>(tableCategory==='all'||t.category===tableCategory)&&(!search||t.name.toLowerCase().includes(search.toLowerCase())));return `<div class="notice">默认组件按源码逐项盘点；当前页面额外的 2 个自建组件单列保留。资源数量表示“已有备选”，不代表所有模板都已经具备设备添加能力。</div><div class="roadmap">${[['P0 · 参数与资源契约','建立类型 → 采集方式 → 动态参数的映射；核对指标名、必需标签与凭据种类。'],['P1 · 高频单实例','完善主机 Agent / SNMP，优先接入关系库、Redis / MongoDB / ES、Web 状态接口和拨测。'],['P2 · 集群与多角色','接入 TiDB / Doris、队列、Kubernetes、存储、网络硬件与 JMX；按角色关联资源。'],['P3 · 发现与特殊执行','云账户资源发现、推送通道、已有指标关联和本机专项；命令执行另做权限隔离。']].map(([title,body])=>`<article><h3>${title}</h3><p>${body}</p></article>`).join('')}</div><div class="plan-head"><input id="catalog-search" placeholder="搜索模板名称，如 MySQL / SNMP" value="${esc(search)}"><select id="catalog-category" style="max-width:250px"><option value="all">全部类型（91 个组件）</option>${CATALOG.categories.map(c=>`<option value="${c.id}" ${tableCategory===c.id?'selected':''}>${c.name}（${c.templates.length}）</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>模板组件</th><th>设备 / 服务类型</th><th>拟采用的采集方式</th><th>现有四部分资源</th><th>接入缺口 / 当前状态</th><th>查看</th></tr></thead><tbody>${rows.map(t=>{const c=CATALOG.categories.find(x=>x.id===t.category);return `<tr><td><strong>${esc(t.name)}</strong><br><span class="tag ${t.origin==='custom'?'orange':''}">${t.origin==='custom'?'当前自建':'源码默认'}</span></td><td>${c.name}<br><span class="muted">${c.phase}</span></td><td>${modeFor(t)}</td><td>${t.origin==='custom'?'资源待独立核对':`说明 ${t.instructions?'✓':'—'} · 指标 ${t.metricCount}<br>仪表盘 ${t.boards.length} · 告警 ${t.alerts.length}`}</td><td><span class="tag ${t.name.endsWith('_SNMP')?'green':'orange'}">${t.state}</span><div class="tiny muted" style="max-width:280px;margin-top:6px">${esc(t.gaps.join('；')||'已有源文件；仍需结构化参数和标签契约')}</div></td><td><button class="link-btn" data-category="${c.id}" data-template="${esc(t.name)}" data-demo="1">打开原型 ↗</button></td></tr>`}).join('')}</tbody></table></div><p class="muted tiny" style="margin-top:12px">${rows.length} / 91 个组件 · “告警”按规则条目计数，“仪表盘”按模板文件计数。来源与分类说明见同目录 README.md 和 catalog.json。</p>`}
function initializeSelection(){const t=templateOf(state);state.boards=t.boards.length?[0]:[];state.alerts=(t.name.endsWith('_SNMP')||['database','data-services','web','probes','local','infra'].includes(t.category))?t.alerts.map((_,i)=>i):[];state.values={group:'Default Busi Group',collector:'categraf01（示例）',interval:'30'};}
function act(action){if(action==='overview'||action==='plan'){view=action;route();return}if(action==='form'){view='form';state.result=false;route();return}if(action==='next'){state.step=Math.min(4,state.step+1);state.result=false;route();return}if(action==='back'){state.step=Math.max(1,state.step-1);state.result=false;route();return}if(action==='examples'){state=applyExamples(state);route();return}if(action==='reset'){state=initialState(state.category,state.component);initializeSelection();route();return}if(action==='prev-type'||action==='next-type'){const i=CATALOG.categories.findIndex(x=>x.id===state.category);state=initialState(CATALOG.categories[(i+(action==='next-type'?1:-1)+16)%16].id);initializeSelection();view='form';route();return}if(action==='simulate'){const missing=validate(state);if(missing.length){state.test='示例参数待完善';state.message='请填写：'+missing.join('、')}else if(['Skywalking','Greenplum'].includes(state.component)||templateOf(state).origin==='custom'){state.test='模板契约待补齐';state.message='字段可先评审；当前模板映射尚不完整，不能显示为真实接入成功。'}else if(state.scenario==='成功示例'){state.test='模拟通过';state.message='演示参数已齐全。实际开发仍需从所选采集器核对连通性、权限、指标和标签。'}else{state.test=state.scenario;state.message=state.scenario==='模拟权限不足'?'保留输入，指出缺少的监控权限，允许修改凭据后重试。':state.scenario==='模拟指标名不匹配'?'目标可达，但现有模板的指标名 / 标签不匹配；需更换兼容模板或调整映射。':'采集器不可达，保留配置并提示采集器状态；不会把保存成功当作采集生效。'}route();return}if(action==='preview'){state.result=true;state.message='已生成本页添加方案；没有调用业务 API，也没有下发配置。';route()}}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.action){act(el.dataset.action);return}if(el.dataset.category){const category=el.dataset.category,component=el.dataset.template;state=choose(state,category,component);initializeSelection();view='form';if(el.dataset.demo){state=applyExamples(state);state.step=2}route();return}if(el.dataset.step){state.step=Number(el.dataset.step);state.result=false;route()}});
document.addEventListener('input',e=>{if(e.target.dataset.field){state.values[e.target.dataset.field]=e.target.value;state.test='尚未模拟';updateSummary()}if(e.target.id==='catalog-search'){const start=e.target.selectionStart;search=e.target.value;render();$('catalog-search').focus();$('catalog-search').setSelectionRange(start,start)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.field){state.values[el.dataset.field]=el.value;state.test='尚未模拟';if(['httpAuth','redisMode','rabbitMode','sasl','sqlAuth','awsAuth'].includes(el.dataset.field))route();else updateSummary()}if(el.id==='scenario')state.scenario=el.value;if(el.id==='catalog-category'){tableCategory=el.value;render()}if(el.dataset.resource){const key=el.dataset.resource==='board'?'boards':'alerts',id=Number(el.value);state[key]=el.checked?[...state[key],id]:state[key].filter(x=>x!==id);updateSummary()}});
document.addEventListener('keydown',e=>{if(view!=='form'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')act('prev-type');if(e.key==='ArrowRight')act('next-type')});
const params=new URLSearchParams(location.search);state=initialState(params.get('type')||'host',params.get('template'));initializeSelection();view=['form','plan'].includes(params.get('view'))?params.get('view'):'overview';state.step=Math.min(4,Math.max(1,Number(params.get('step'))||1));if(params.get('demo')==='1')state=applyExamples(state);route(false);
</script></body></html>
