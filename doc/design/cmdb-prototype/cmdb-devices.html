utton><button class="n-link cursor-interaction" data-open="${d.id}" data-mode="edit" data-origin="ledger">编辑</button></td></tr>`).join('')||`<tr><td colspan="${cols.length+3}" class="n-small">暂无匹配设备，请调整查询条件。</td></tr>`}</tbody></table></div><div class="n-tablefoot"><span>共 ${rows.length} 台 · 已选择 ${selected.size} 台</span><span>当前展示全部查询结果</span></div></div>`;}

function locationView(){const choices=[...new Map(devices.map(d=>[d.room+'|'+d.rack,[d.room,d.rack]])).values()];let group=devices.filter(d=>d.room===room&&d.rack===rack);if(!group.length&&devices.length){room=devices[0].room;rack=devices[0].rack;group=devices.filter(d=>d.room===room&&d.rack===rack);}if(!group.some(d=>d.id===current)&&group.length)current=group[0].id;const d=devices.find(d=>d.id===current),units=[];for(let u=42;u>=1;u--)units.push(`<span class="n-u" style="grid-row:${43-u}">${u}U</span><div class="n-slot" style="grid-row:${43-u}"></div>`);group.forEach(d=>units.push(`<button class="n-rack-device cursor-interaction" style="grid-row:${43-Number(d.uEnd)} / ${44-Number(d.uStart)}" data-device="${d.id}" aria-pressed="${d.id===current}">${esc(d.hostname)}</button>`));$('[data-content="location"]').innerHTML=`<div class="n-location"><aside class="n-sheet n-tree"><h3>机房 / 机柜</h3>${[...new Set(choices.map(x=>x[0]))].map(r=>`<div class="n-room">${esc(r)}</div>${choices.filter(x=>x[0]===r).map(([r,k])=>`<button class="n-treebtn cursor-interaction" data-rack="${esc(k)}" data-room="${esc(r)}" aria-pressed="${r===room&&k===rack}">${esc(k)} <span>${devices.filter(d=>d.room===r&&d.rack===k).length}</span></button>`).join('')}`).join('')}</aside><div><p class="n-small" style="margin-bottom:14px">${esc(room)} / ${esc(rack)} · ${group.length} 台设备</p><div class="n-rack-layout"><div class="n-rack"><div class="n-rack-title"><span>${esc(rack)}</span><span>42U</span></div><div class="n-rack-space">${units.join('')}</div></div><div>${d?detail(d):'<div class="n-sheet n-panel">暂无设备</div>'}</div></div></div></div>`;}
function inQueue(d,k){return k==='all'||k==='soon'&&warranty(d)==='即将过保'||k==='expired'&&warranty(d)==='已过保'||k==='unmonitored'&&d.monitored==='否'||k==='noalert'&&d.monitored==='是'&&d.alertEnabled==='否';}
function warrantyView(){const counts=[['all','全部设备'],['soon','即将过保'],['expired','已过保'],['unmonitored','未接入监控'],['noalert','已监控未报警']],rows=devices.filter(d=>inQueue(d,queue));$('[data-content="warranty"]').innerHTML=`<div class="n-priority">${counts.map(([k,l])=>`<button class="n-btn cursor-interaction" data-queue="${k}" aria-pressed="${queue===k}"><span>${l}</span><span class="n-count">${devices.filter(d=>inQueue(d,k)).length}</span></button>`).join('')}</div><div class="n-sheet"><div class="n-tabletop"><h3>${counts.find(x=>x[0]===queue)[1]}</h3><span class="n-small">完善维保或监控配置</span></div><div class="n-scroll"><table aria-label="维保监控设备"><thead><tr><th>主机 / 所属业务</th><th>机房 / 机柜</th><th>过保时间</th><th>保修状态</th><th>监控状态</th><th>报警</th><th>操作</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${esc(d.hostname)}<div class="n-small">${esc(d.business||'未填写')}</div></td><td>${esc(d.room)}<div class="n-small">${esc(d.rack)}</div></td><td>${esc(d.expire||'—')}</td><td>${badge(warranty(d))}</td><td>${badge(status(d))}</td><td>${d.alertEnabled==='是'?badge('已启用'):badge(d.monitored==='是'?'报警未启用':'未启用')}</td><td class="n-actions"><button class="n-link cursor-interaction" data-open="${d.id}" data-mode="edit" data-origin="warranty">完善档案</button></td></tr>`).join('')||'<tr><td colspan="7" class="n-small">当前无此类设备</td></tr>'}</tbody></table></div><div class="n-monitor-note">未开启报警不代表监控离线；是否监控也不影响设备维保状态。</div></div>`;}

deviceDialog.innerHTML=`<form id="n-device-form" class="n-modal-form" data-readonly="${readonly}"><header class="n-modal-head"><div><h3 id="n-dialog-title">${mode==='add'?'添加设备':readonly?'查看设备':'编辑设备'}</h3><p id="n-dialog-subtitle" class="n-small">${esc(d.hostname||'新设备')} · ${id||'保存后生成资产 ID'}</p></div><button type="button" class="n-btn n-modal-close cursor-interaction" data-action="close-editor" aria-label="关闭设备弹窗">×</button></header><div class="n-modal-body">${groups.map(([title,keys])=>`<h3 class="n-group-title">${title}</h3><div class="n-fields">${keys.map(k=>{const f=fields.find(f=>f[0]===k);return field(k,f[1],d[k],f[2],readonly,['customer','serial'].includes(k));}).join('')}</div>`).join('')}<h3 class="n-group-title">硬盘信息</h3><div id="n-disk-editor"></div>${readonly?'':'<button type="button" class="n-btn cursor-interaction" data-action="add-disk">添加硬盘组</button>'}</div><footer class="n-modal-footer"><span class="n-error" role="alert" id="n-editor-error"></span>${readonly?'<span class="n-small">当前为只读查看</span>':''}<button type="button" class="n-btn cursor-interaction" data-action="close-editor">${readonly?'关闭':'取消'}</button>${readonly?`<button type="button" class="n-btn primary cursor-interaction" data-open="${id}" data-mode="edit" data-origin="${origin}">编辑设备</button>`:'<button type="submit" class="n-btn primary cursor-interaction">保存设备（模拟）</button>'}</footer></form>`;

root.addEventListener('change',e=>{const t=e.target;if(t.hasAttribute('data-select')){t.checked?selected.add(t.dataset.select):selected.delete(t.dataset.select);ledger();}else if(t.hasAttribute('data-select-all')){devices.filter(matches).forEach(d=>t.checked?selected.add(d.id):selected.delete(d.id));ledger();}else if(t.hasAttribute('data-column')){if(t.checked)visibleCols.push(t.dataset.column);else visibleCols=visibleCols.filter(k=>k!==t.dataset.column);ledger();$('#n-column-panel').hidden=false;}if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const x=b.dataset;
if(x.open)openEditor(x.open,x.mode,x.origin);else if(x.pick){chosen=schemes[x.pick];feedback='当前选择：'+chosen;render();}else if(x.rack){rack=x.rack;room=x.room;locationView();}else if(x.device){current=x.device;locationView();}else if(x.detailTab){detailTab=x.detailTab;locationView();}else if(x.queue){queue=x.queue;warrantyView();}else if(x.removeDisk!==undefined){gatherDisks();draftDisks.splice(Number(x.removeDisk),1);renderDisks();}else if(x.action==='add')openEditor(null,'add','ledger');else if(x.action==='close-editor')closeEditor();else if(x.action==='add-disk'){gatherDisks();draftDisks.push({model:'',description:'',count:''});renderDisks();}else if(x.action==='reset'){filters={};feedback='';render();}else if(x.action==='columns')$('#n-column-panel').hidden=!$('#n-column-panel').hidden;else if(x.action==='export'||x.action==='template')download(x.action==='template');else if(x.action==='import')importPanel();else if(x.action==='delete'){closeEditor();const wrap=$('[data-editor="ledger"]');wrap.hidden=false;wrap.innerHTML=`<div class="n-sheet n-panel"><h3>删除所选设备</h3><p class="n-small" style="margin:12px 0">将从本次演示中移除 ${selected.size} 台，刷新页面可恢复。</p><div class="n-toolbar"><button class="n-btn primary cursor-interaction" data-action="confirm-delete">确认删除（模拟）</button><button class="n-btn cursor-interaction" data-action="close-editor">取消</button></div></div>`;wrap.scrollIntoView({block:'start',behavior:'smooth'});}else if(x.action==='confirm-delete'){devices=devices.filter(d=>!selected.has(d.id));selected.clear();current=devices[0]?.id||'';closeEditor();feedback='已删除所选设备（模拟）';render();}saveState();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();
if(globalThis.Tweak){const s={compact:false};new Tweak({container:root,onChange:()=>root.style.setProperty('--n-row-pad',s.compact?'7px':'11px')}).addToggle(s,'compact',{label:'紧凑表格'});}
})();
</script>
