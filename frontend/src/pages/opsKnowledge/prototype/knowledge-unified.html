function status(d){let s=d.status;if(state.retried&&s==='failed')s='ready';const map={ready:[badge('● 已整理','green'),'原文与摘要可检索'],partial:[badge('◐ 部分解析','amber'),'正文可查 · 1 张附表待核对'],ocr:[badge('◷ 待 OCR','gray'),'尚无可检索正文'],failed:[badge('● 原文可检索','green'),'摘要整理失败 · 可重试'],upload:[badge(state.uploadDone?'● 已整理':'◌ 整理中',state.uploadDone?'green':'purple'),state.uploadDone?'原文与摘要可检索':'原文已可检索']};return `<div>${map[s][0]}<div class="substate">${map[s][1]}</div></div>`;}

function knowledgeView(){const query=state.query.trim();let hits=[{id:0,type:'doc',title:'LIS 接口部署与维护手册',desc:'报告经接口服务与消息队列投递。投递超时进入重试队列。排查时先确认队列积压和最近成功投递时间，再核查日志与目标服务状态。',loc:'第 12–13 页 · 4.2 报告回传',kind:'来源原文',color:'blue',date:'2026-11-15 · v3'}, {id:1,type:'doc',title:'11 月信息系统变更记录',desc:'11 月 14 日的重试间隔调整仅针对测试环境，生产环境保持原配置。不能直接用测试变更解释生产故障。',loc:'第 3 节 · 接口配置调整',kind:'来源原文',color:'blue',date:'2026-11-15 · v2'},{id:5,type:'case',title:'历史案例：接口消息积压与补发核对',desc:'历史故障曾因目标服务短时不可达产生消息积压。恢复时核对了补发情况和重复投递。本案例的环境、时间与本次情况需要分别核实。',loc:'故障复盘 · 2026-11-11',kind:'故障案例',color:'purple',date:'2026-11-11 · v4'}];if(state.filter==='guide')hits=[];else if(state.filter==='doc')hits=hits.filter(x=>x.type==='doc');else if(state.filter==='case')hits=hits.filter(x=>x.type==='case');if(query&&!/LIS|回传|报告|接口|积压|变更|重试|消息|生产|测试|服务/i.test(query))hits=[];return `${scopebar()}<div class="liblayout"><aside class="libtree"><div class="treetitle">知识类型</div>${[['all','全部知识','book','18'],['doc','客户文档','file','12'],['case','故障案例','chat','4'],['guide','已验证预案','check','2']].map(([k,t,i,n])=>`<button class="treebutton ${state.filter===k?'active':''}" data-filter="${k}">${icon(i)}${t}<span>${n}</span></button>`).join('')}<div class="treetitle" style="margin-top:24px">常用标签</div><div class="tagline" style="padding:0 10px"><span class="tag">LIS</span><span class="tag">接口服务</span><span class="tag">变更</span><span class="tag">消息队列</span></div><div class="shared-line">资料原文、历史经验和正式预案统一检索，保留各自状态。</div></aside><section><form class="knowledge-search" id="knowledgeForm">${icon('search')}<input aria-label="搜索知识" id="knowledgeQuery" placeholder="搜索标题、关键词、错误码或文档内容" value="${esc(state.query)}"><button class="btn primary" type="submit">搜索</button></form><div class="filterrow">${[['all','全部'],['doc','客户文档'],['case','故障案例'],['guide','已验证预案']].map(([k,t])=>`<button class="${state.filter===k?'active':''}" data-filter="${k}">${t}</button>`).join('')}<span style="flex:1"></span><span class="muted" style="font-size:10px">关键词全文检索</s function chatView(){return `${scopebar()}<div class="chat-layout"><section class="panel chat-main"><div class="chat-context"><div class="intent" aria-label="当前任务"><button data-intent="docs" class="${state.intent==='docs'?'active':''}">${icon('book')} 资料问答</button><button data-intent="ops" class="${state.intent==='ops'?'active':''}">${icon('pulse')} 结合现场排查</button></div><span class="intent-note">同一会话 · 同一知识范围</span></div><div class="messages"><div class="userbubble">LIS 报告回传延迟，现有资料建议先检查哪些环节？</div><div class="bot-label"><span class="bot-logo">N</span>Nightingale AI <span class="muted" style="font-size:10px">根据当前项目资料回答</span></div><div class="support-strip">${icon('check')}已检索 2 份客户资料 · 已核对确切版本与章节</div><div class="answer"><h3>先核对消息队列，再检查投递链路</h3><p>维护手册说明，报告通过接口服务和消息队列投递，超时消息进入重试队列。建议按以下顺序核对：</p><ol><li><strong>消息是否积压：</strong>查看队列待处理量和最近成功投递时间。<button class="ref" data-source="0">1</button></li><li><strong>投递在哪一步失败：</strong>核对接口日志、网络链路及目标服务状态。<button class="ref" data-source="0">1</button></li><li><strong>近期变更是否适用：</strong>已有重试间隔调整记录属于测试环境，生产情况需单独确认。<button class="ref" data-source="1">2</button></li></ol>${citations()}<div class="answer-note">以上是资料中的检查方法，尚未查询本次现场状态，也不能据此确认根因。</div>${!state.live?`<div class="next-action"><button class="btn subtle" data-act="live">${icon('pulse')} 结合现场数据继续排查 ${icon('arrow')}</button><button class="textbtn" data-source="0">先看手册原文</button></div>`:''}</div>${state.live?liveAnswer():''}${state.followup?`<div class="chat-divider">资料追问</div><div class="userbubble">${esc(state.followup)}</div><div class="bot-label"><span class="bot-logo">N</span>资料问答</div><div class="answer"><p>此原型演示沿用已有资料引用。维护手册提供排查顺序；当前变更记录只涵盖测试环境。更多具体结论需要检索相应原文或补充资料。<button class="ref" data-source="0">1</button><button class="ref" data-source="1">2</button></p></div>`:''}</div><form class="compose" id="chatForm"><textarea aria-label="继续提问" placeholder="继续问资料，或结合当前现场状态排查…"></textarea><div class="composefooter"><small>${icon('link')} 已关联项目资料 ${state.live?'及现场示例证据':''} · 内容保留出处</small><button class="send" aria-label="发送示例问题" type="submit">${icon('send')}</button></div></form></section>${sourcePanel()}</div>`;}
function render(){const names={A:'沿用现有导航，逐页增强',B:'目录导航与会话相邻协作',C:'按入库、检索、分析串联任务'};document.getElementById('app').className=`app variant-${state.variant}`;document.getElementById('app').innerHTML=`${sidebar()}<div class="appbody"><header class="topbar"><div class="breadcrumb">工作空间 <span style="margin:0 8px">/</span><b>${views[state.view]}</b></div><div class="toptools"><span class="prototype-label">静态原型 · 示例数据</span><span>市立医院（示例）</span><button title="原型说明" data-act="about">${icon('info')}</button></div></header><main class="workspace">${heading()}${workstrip()}${tabs()}<div class="body-grid">${layouttree()}${queue()}<div class="viewcontent">${state.view==='documents'?documentView():state.view==='knowledge'?knowledgeView():chatView()}</div></div></main></div><nav class="prototypebar" aria-label="原型布局切换"><button data-act="prev" aria-label="上一个布局">${icon('chevron').replace('class="i"','class="i" style="transform:rotate(180deg)"')}</button><div class="prototypetext"><small>方案 ${state.variant} / 3 · ${views[state.view]} · 仅示例状态</small><strong>${layouts[state.variant]} · ${names[state.variant]}</strong></div><button data-act="next" aria-label="下一个布局">${icon('chevron')}</button><span class="bartag">← → 切换布局</span></nav>`;const bar=document.querySelector('.prototypebar');if(bar&&!(location.protocol==='file:'||/^(localhost|127\.0\.0\.1|192\.168\.[\d.]+|10\.[\d.]+|n9e-dev[0-9]\.zhiteng\.win)$/.test(location.hostname)))bar.style.display='none';bind();}
function bind(){document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>go(e.dataset.view));document.querySelectorAll('[data-source]').forEach(e=>e.onclick=()=>openSource(Number(e.dataset.source)));document.querySelectorAll('[data-filter]').forEach(e=>e.onclick=()=>{state.filter=e.dataset.filter;render();});document.querySelectorAll('[data-intent]').forEach(e=>e.onclick=()=>{state.intent=e.dataset.intent;if(state.intent==='ops')state.live=true;render();toast(state.intent==='ops'?'已沿用资料与会话，补充现场示例证据':'仍在同一会话中，资料与引用保留');});document.querySelectorAll('[data-act]').forEach(e=>e.onclick=()=>act(e.dataset.act,e));document.querySelectorAll('[data-scope]').forEach(e=>e.onchange=()=>{e.selectedIndex=0;openModal('scope');});const ds=document.getElementById('docSearch');if(ds)ds.oninput=()=>{state.docQuery=ds.value;const p=ds.selectionStart;render();const next=document.getElementById('docSearch');next.focus();next.setSelectionRange(p,p);};const k=document.getElementById('knowledgeForm');if(k)k.onsubmit=e=>{e.preventDefault();state.query=document.getElementById('knowledgeQuery').value;render();};const cf=document.getElementById('chatForm');if(cf)cf.onsubmit=e=>{e.preventDefault();const t=cf.querySelector('textarea').value.trim();if(!t)return;state.followup=t;render();};}
function act(a,e){if(a==='prev')return cycle(-1);if(a==='next')return cycle(1);if(a==='upload')return openModal('upload');if(a==='settings')return openModal('settings');if(a==='initialize')return openModal('initialize');if(a==='about')return openModal('about');if(a==='live'){state.intent='ops';state.live=true;render();return toast('同一会话已补充现场示例证据');}if(a==='retry'){state.retried=true;render();return toast('演示：摘要整理已重试成功，原文保持可检索');}if(a==='finish-upload'){state.uploadDone=true;render();return toast('演示：已完成整理，知识版本可查看');}if(a==='linked-knowledge'||a==='folder-all'){state.filter='all';state.query='LIS 报告回传';return go('knowledge');}if(a==='ask-source'){state.intent='docs';return go('chat');}if(a==='evidence')return openModal('evidence');if(a==='ocr')return openModal('ocr');if(a==='issues')return openSource(4);if(a==='note'){state.note=true;render();return toast('演示：已加入本次笔记，未发布为正式知识');}if(a==='new-chat'){state.live=false;state.intent='docs';state.followup='';state.note=false;render();return toast('已重置示例会话');}return toast('这是静态原型，其他业务入口保持不变');}
function openSource(n,tab='source'){state.source=n;state.docTab=tab;const s=sourceData[n];const e=document.getElementById('sourceOverlay');e.className='overlay open';e.setAttribute('aria-hidden','false');e.innerHTML=`<section class="drawer" role="dialog" aria-modal="true" aria-labelledby="sourceTitle"><header class="drawerhead"><div><h2 id="sourceTitle">${s.title}</h2><p>客户资料 / 市立医院 / 信息化运维项目</p></div><button class="iconbtn" aria-label="关闭原文" data-close="source">${icon('close')}</button></header><div class="drawerbody"><div class="row" style="margin-bottom:15px">${badge(s.kind,'blue')}${badge(n===4?'待 OCR':'已保存版本',n===4?'gray':'green')}${badge(s.version,'purple')}</div><div class="meta"><div><span>资料日期</span>${s.date}</div><div><span>当前位置</span>${s.where}</div><div><span>来源</span>${s.file}</div><div><span>检索范围</span>当前项目</div></div><div class="tabs">${[['source','原文'],['markdown','Markdown'],['summary','整理摘要']].map(([k,t])=>`<button data-doctab="${k}" class="${tab===k?'active':''}">${t}</button>`).join('')}</div>${tab==='markdown'?`<pre class="mdcode"># ${esc(s.title)}\n\n来源版本：${s.version}\n定位：${esc(s.where)}\n\n## ${esc(s.heading)}\n\n${esc(s.text)}\n\n${esc(s.extra)}</pre>`:tab==='summary'?`<article class="doctext"><h3>Agent 整理摘要</h3><p>${s.text}</p><blockquote>${s.extra}</blockquote><p class="muted small">派生摘要 · 依据 ${s.version} 原文 · 未作为可执行规程发布</p></article>`:`<article class="doctext"><h3>${s.title}</h3><p class="muted small">${s.version} · ${s.date} · ${s.where}</p><h4>${s.heading}</h4><p>${s.text}</p><blockquote>${s.extra}</blockquote><p class="muted small">此处展示原型文字摘录，正式页面应打开确切原文版本及位置。</p></article>`}<div class="row" style="margin-top:25px"><button class="btn primary" data-source-use>${icon('spark')} 引用到当前会话</button><button class="btn" data-close="source">返回</button></div></div></section>`;e.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSource);e.querySelectorAll('[data-doctab]').forEach(b=>b.onclick=()=>openSource(n,b.dataset.doctab));e.querySelector('[data-source-use]').onclick=()=>{closeSource();go('chat');toast('演示：已关联到同一会话，资料可用于问答和排障');};e.onclick=x=>{if(x.target===e)closeSource();};e.querySelector('[data-close]').focus();}
function closeSource(){const e=document.getElementById('sourceOverlay');e.className='overlay';e.setAttribute('aria-hidden','true');e.innerHTML='';}
function openModal(type){const e=document.getElementById('modalOverlay');let title='',desc='',body='',ok='知道了';if(type==='upload'){title='上传资料并自动同步';desc='上传到当前项目，保存成功后开始解析和知识整理。';body=`<div class="uploadarea">${icon('upload')}<strong>月度巡检补充说明.docx</strong>Word 文档 · 246 KB · 演示文件</div><label class="field">所属知识空间<select aria-label="上传知识空间"><option>市立医院 / 信息化运维项目</option></select></label><label class="switch"><input type="checkbox" checked aria-label="上传后自动整理">上传后自动同步到知识库</label><div class="shared-line">原件保留，整理结果包含来源引用；同一份资料可用于问答与排障。</div>`;ok='演示上传';}else if(type==='settings'){title='知识同步设置';desc='对当前档案生效，后续文档默认继承。';body=`<label class="field">目标知识空间<select><option>市立医院 / 信息化运维项目</option></select></label><label class="switch"><input type="checkbox" ${state.sync?'checked':''} id="syncToggle">自动同步已保存版本</label><div class="shared-line">私有草稿不纳入；新版本自动更新。原文与知识使用相同访问范围。</div>`;ok='保存示例设置';}else if(type==='initialize'){title='同步已有资料';desc='将当前项目的已保存版本加入知识处理队列。';body='<div class="quotecard">6 份现有资料 · 相同版本不重复整理<br>扫描件显示待 OCR；可用正文先进入检索。</div><p class="small muted">本原型只展示批量初始化入口，不读取服务器文件。</p>';ok='演示开始同步';}else if(type==='scope'){title='切换知识范围';desc='切换客户会开启新的会话，避免混用资料与历史内容。';body='<div class="quotecard">当前原型提供“市立医院 / 信息化运维项目”这一组示例。当前项目内切换问答和排查，不会清除会话。</div>';}else if(type==='evidence'){title='现场证据 · 只读查询示例';desc='以下数据仅用于页面展示，没有查询真实监控系统。';body=`<div class="metricrow"><div class="metric"><small>待处理消息</small><b>128</b></div><div class="metric"><small>投递超时</small><b>12 次</b></div><div class="metric"><small>业务反馈</small><b>待核实</b></div></div><div class="quotecard" style="margin-top:18px">对象：LIS 接口服务（示例）<br>窗口：11-16 12:35–12:40<br>来源：示例指标与规则日志<br>状态：尚不足以确认根因</div>`;}else if(type==='ocr'){title='扫描资料待补文字';desc='原件保留，但当前示例尚未生成可检索正文。';body='<div class="quotecard">可补充经过核对的文字版本；后续接入 OCR 后可自动识别。本版不要求配置 Embedding 或重排序模型。</div>';}else{title='统一知识协同 · 静态原型';desc='本轮用来比较页面布局，没有接入正式功能。';body='<div class="quotecard">三种布局：A 原有页面增强、B 知识与会话并排、C 任务步骤工作台。<br>资料、指标、文件上传和回答均为示例。<br>刷新会清除演示状态；可用底部左右箭头切换布局。</div>';}
e.className='overlay open';e.setAttribute('aria-hidden','false');e.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div style="display:flex;justify-content:space-between;align-items:flex-start"><h2 id="modalTitle">${title}</h2><button class="iconbtn" aria-label="关闭弹窗" data-close>${icon('close')}</button></div><div class="desc">${desc}</div>${body}<div class="modalfooter"><button class="btn" data-close>取消</button><button class="btn primary" id="modalConfirm">${ok}</button></div></section>`;e.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);e.querySelector('#modalConfirm').onclick=()=>{if(type==='upload'){state.uploaded=true;closeModal();go('documents');toast('演示：原文已可检索，Agent 整理中');}else if(type==='settings'){state.sync=e.querySelector('#syncToggle').checked;closeModal();render();toast('示例设置已保留到本次页面刷新前');}else if(type==='initialize'){closeModal();toast('演示：已登记批量同步，已有有效版本保持可查');}else closeModal();};e.onclick=x=>{if(x.target===e)closeModal();};e.querySelector('[data-close]').focus();}
function closeModal(){const e=document.getElementById('modalOverlay');e.className='overlay';e.setAttribute('aria-hidden','true');e.innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSource();closeModal();return;}if(e.target.closest('input,textarea,select,[contenteditable]')||document.querySelector('.overlay.open'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1);}});
render();
</script>
</body></html>
