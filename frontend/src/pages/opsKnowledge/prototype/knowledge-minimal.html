function toast(t){const e=document.getElementById('toast');e.className='toast';e.textContent=t;e.hidden=false;clearTimeout(window.t);window.t=setTimeout(()=>e.hidden=true,2500)}
function syncURL(){const u=new URL(location);u.searchParams.set('page',state.page);history.replaceState(null,'',u)}
function page(p){state.page=p;state.menu=false;syncURL();render()}
function navigation(){const entries=[['home','首页','home'],['quick','快捷跳转','search'],['archives','档案管理','folder'],['cases','告警处置','folder'],['knowledge','运维知识','folder'],['chat','Nightingale AI','spark'],['data','数据查询','grid'],['alerts','告警通知','alert'],['hosts','基础设施','server'],['integrations','集成中心','grid'],['people','人员组织','chat'],['system','系统配置','settings']];return `<aside class="mainnav"><div class="brand"><img src="${logo}" alt=""><span>Nightingale</span></div><div class="onboarding"><span class="ring"></span>新手引导<small>5/9</small></div><nav class="nav" aria-label="主导航">${entries.map(([p,t,i])=>`<button data-page="${p}" class="${state.page===p?'active':''}">${icon(i)}<span class="navlabel">${t}</span>${['data','alerts','hosts','integrations','people','system'].includes(p)?icon('chevron').replace('class="i"','class="i down"'):''}</button>`).join('')}</nav><div class="account"><span class="avatar">A</span><div class="account-name"><b>Admin</b><small>root</small></div>${icon('settings')}</div></aside>`}
function prototypeBadge(){return '<button class="prototype-label" data-action="about">静态原型 · 示例数据</button>'}
function aiside(){return `<aside class="ai-side"><h1>Nightingale AI ${icon('book')}</h1><button class="sidebutton active" data-action="new">${icon('chat')}新建会话</button><button class="sidebutton" data-action="placeholder">${icon('server')}LLM 管理</button><button class="sidebutton" data-action="placeholder">${icon('grid')}Skill 管理</button><div class="sidehr"></div><div class="conversation-head">会话</div><label class="conversation-search">${icon('search')}<input placeholder="搜索会话" aria-label="搜索会话"></label><div class="history-date">2026-11-16</div><button class="history-item" data-action="history-answer">${icon('chat')}<span>LIS 接口资料与排查顺序</span></button><button class="history-item" data-action="history-answer">${icon('chat')}<span>项目交付文档要点</span></button><button class="history-item" data-action="placeholder">${icon('chat')}<span>帮我生成一个查询主机 CPU…</span></button><div class="history-date">2026-11-12</div><button class="history-item" data-action="placeholder">${icon('chat')}<span>分析这条告警事件的根因</span></button><button class="history-item" data-action="placeholder">${icon('chat')}<span>你好</span></button></aside>`}
function welcome(){return `<section class="welcome"><h2><span class="ai-orb"></span>你好,我是<span class="title-purple">NightingaleAI</span></h2><div class="welcome-cards"><button class="welcome-card" data-action="placeholder">${icon('search')}<b>快速了解夜莺</b><span>一分钟看懂产品与 AI 助手能做什么</span></button><button class="welcome-card" data-action="placeholder">${icon('server')}<b>盘一盘我的告警</b><span>哪些规则最吵、哪些从没触发过</span></button><button class="welcome-card" data-action="placeholder">${icon('clock')}<b>一句话配一条告警</b><span>描述场景，我来生成 PromQL 和阈值</span></button></div></section>`}
function ref(n){return `<button class="citation" data-source="${n}" aria-label="查看来源 ${n+1}">${n+1}</button>`}
function response(m){if(m.kind==='forbidden')return `<div class="answer notice-answer"><h3>没有权限查阅</h3><p>你当前没有权限查阅这份资料。请联系管理员确认访问权限。</p></div>`;if(m.kind==='empty')return `<div class="answer notice-answer"><h3>未找到相关资料</h3><p>在你当前可查阅的资料中，未找到相关记录。</p><p>可以补充文档名称或关键词，或者在档案管理中上传已有资料。</p></div>`;return `<div class="answer"><h3>先核对消息队列，再检查投递链路</h3><p>维护手册说明，报告经接口服务和消息队列投递。根据已保存资料，建议按以下顺序核对：</p><ol><li><b>消息是否积压：</b>查看队列待处理量和最近成功投递时间。${ref(0)}</li><li><b>投递在哪一步失败：</b>核对接口日志、网络链路及目标服务状态。${ref(0)}</li><li><b>近期变更是否适用：</b>现有重试间隔调整记录属于测试环境，不能直接用于解释生产故障。${ref(1)}</li></ol><div class="citations"><button class="source-card" data-source="0"><b>1 · LIS 接口部署与维护手册</b><small>v3 · 第 12–13 页</small></button><button class="source-card" data-source="1"><b>2 · 11 月信息系统变更记录</b><small>v2 · 第 3 节</small></button></div><p class="note">以上是资料中的检查方法；尚未取得本次现场证据，根因仍需核实。</p></div>`}
function messages(){return `<div class="messages">${state.messages.map(m=>`<div class="msg-user">${esc(m.query)}</div><div class="bot-head"><span class="ai-orb bot-orb"></span>Nightingale AI</div>${response(m)}`).join('')}</div>`}
function composer(){return `<div class="composer-wrap"><form class="composer" id="composer"><textarea id="draft" aria-label="输入问题" placeholder="输入问题，Enter 发送，Shift + Enter 换行">${esc(state.draft)}</textarea><div class="composer-footer"><button type="button" class="plus-btn ${state.menu?'open':''}" id="modePlus" aria-label="选择模式" aria-haspopup="menu" aria-expanded="${state.menu}">${icon('plus')}</button>${state.mode==='docs'?'<span class="current-mode">'+icon('book')+'资料问答</span>':''}<button class="send" type="submit" aria-label="发送">${icon('send')}</button></div>${state.menu?`<div class="modes" role="menu" aria-label="模式选择"><div class="mode-title">模式</div>${Object.entries(modes).map(([k,[title,desc,i]])=>`<button type="button" class="mode-item ${state.mode===k?'selected':''}" role="menuitemradio" aria-checked="${state.mode===k}" data-mode="${k}">${icon(i)}<span><b>${title}</b><small>${desc}</small></span>${state.mode===k?icon('check').replace('class="i"','class="i checkmark"'):''}</button>`).join('')}</div>`:''}</form></div>`}
function chat(){return `<div class="ai-layout">${aiside()}<section class="chat-area"><header class="chat-header"><span class="desktop-title">${state.messages.length?esc(state.messages[0].query.length>26?state.messages[0].query.slice(0,26)+'…':state.messages[0].query):'新建会话'}</span><span class="reduced-header">${icon('spark')}<b>Nightingale AI</b></span>${prototypeBadge()}</header><div class="chat-scroll" id="chatScroll">${state.messages.length?messages():welcome()}</div>${composer()}</section></div>`}
function archiveHeader(){return `<header class="archive-top"><div class="archive-tabs"><button data-action="placeholder">培训服务</button><button data-action="placeholder">巡检报告</button><button data-action="placeholder">故障报告</button><button class="active" data-page="archives">其他文档</button></div><div class="header-actions">${prototypeBadge()}<button class="secondary" data-page="chat">${icon('spark')}Nightingale AI</button><button class="secondary" data-action="placeholder">${icon('book')}产品文档</button></div></header>`}
function archives(){const d=state.uploaded?[{name:'月度巡检补充说明.docx',purpose:'巡检报告',type:'Word',version:'v1',status:'整理中',desc:'原文已可检索',id:2},...docs]:docs;return `${archiveHeader()}<main class="archive-main"><div class="archive-heading"><div><h1>LIS 系统交付资料</h1><p>档案管理 / 其他文档 / 已保存</p></div><div class="header-actions"><button class="secondary" data-action="placeholder">编辑档案</button><button class="secondary" data-page="chat">${icon('spark')}在 AI 中提问</button></div></div><section class="panel"><div class="panel-title">档案信息</div><div class="metadata"><div><span>文档类别</span>其他文档</div><div><span>负责人</span>信息科</div><div><span>创建时间</span>2026-11-12</div><div><span>主题</span>LIS 系统交付资料</div><div><span>资料类型</span>项目交付</div><div><span>更新时间</span>2026-11-16</div></div></section><section class="panel"><div class="panel-title">文档与附件</div><div class="tabletools"><div class="header-actions"><button class="secondary primary" data-action="upload">${icon('upload')}上传附件</button><button class="secondary" data-action="placeholder">新建在线文档</button><button class="secondary" data-action="placeholder">下载文档</button></div><small>上传或保存后自动整理到知识库</small></div><div class="tablebox"><table><thead><tr><th>资料名称</th><th>用途</th><th>类型</th><th>版本</th><th>知识整理</th><th>操作</th></tr></thead><tbody>${d.map(x=>`<tr><td><div class="file">${icon('file')}<div><b>${x.name}</b><small>已保存版本</small></div></div></td><td>${x.purpose}</td><td>${x.type}</td><td>${x.version}</td><td><span class="badge ${x.status==='待 OCR'||x.status==='部分解析'?'warn':x.status==='整理中'?'wait':''}">${x.status}</span><div class="subtext">${x.desc}</div></td><td><button class="act" data-source="${x.id}">阅读</button>${x.status!=='待 OCR'?'<button class="act" data-page="knowledge">查看知识</button>':''}</td></tr>`).join('')}</tbody></table></div></section></main>`}
function knowledge(){return `<header class="chat-header"><span>运维知识</span>${prototypeBadge()}</header><main class="knowledge-main"><h1>运维知识</h1><form class="searchbox" id="knowledgeSearch">${icon('search')}<input placeholder="搜索资料、案例或预案" aria-label="搜索知识"><button type="submit" class="secondary primary">搜索</button></form><div class="ktabs"><button class="active" data-action="placeholder">全部</button><button data-action="placeholder">客户资料</button><button data-action="placeholder">故障案例</button><button data-action="placeholder">排障预案</button></div>${sources.slice(0,3).map((s,i)=>`<article class="result"><small>档案管理 / LIS 系统交付资料 · 来源原文</small><h3>${s.title}</h3><p>${s.text}</p><footer><small>${s.version} · ${s.where} · ${s.date}</small><div><button class="act" data-source="${i}">查看原文</button><button class="act" data-action="ask">在 AI 中提问</button></div></footer></article>`).join('')}</main>`}
function render(){document.getElementById('root').className='shell';document.getElementById('root').innerHTML=`${navigation()}<div class="body">${state.page==='archives'?archives():state.page==='knowledge'?knowledge():chat()}</div>`;bind()}
function submit(){const q=state.draft.trim();if(!q)return;const kind=/无权限|受限|指定档案|客户合同/.test(q)?'forbidden':/不存在|找不到|2026\s*年?\s*12\s*月|十二月/.test(q)?'empty':'answer';state.messages.push({query:q,kind,mode:state.mode});state.draft='';state.menu=false;render();document.getElementById('chatScroll').scrollTop=100000;document.getElementById('draft').focus()}
function bind(){document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>['chat','archives','knowledge'].includes(e.dataset.page)?page(e.dataset.page):toast('此原型保留现有菜单，未接入其他业务页面'));document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>action(e.dataset.action));document.querySelectorAll('[data-source]').forEach(e=>e.onclick=()=>source(Number(e.dataset.source)));document.querySelectorAll('[data-mode]').forEach(e=>e.onclick=()=>{state.mode=e.dataset.mode;state.menu=false;render();document.getElementById('modePlus').focus()});const plus=document.getElementById('modePlus');if(plus)plus.onclick=e=>{e.stopPropagation();state.menu=!state.menu;render();document.getElementById('modePlus').focus()};const d=document.getElementById('draft');if(d){d.oninput=()=>state.draft=d.value;d.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit()}};document.getElementById('composer').onsubmit=e=>{e.preventDefault();submit()}}const k=document.getElementById('knowledgeSearch');if(k)k.onsubmit=e=>{e.preventDefault();toast('演示：按关键词检索当前账号可查阅的内容')}}
function action(a){if(a==='new'){state.messages=[];state.draft='';state.menu=false;render();return}if(a==='history-answer'||a==='ask'){state.mode='docs';state.messages=[{query:examples.answer,kind:'answer',mode:'docs'}];return page('chat')}if(a==='upload')return upload();if(a==='about')return about();toast('此处沿用现有功能，本轮原型未接入真实业务')}
function closeOverlay(){document.getElementById('overlay').className='overlay';document.getElementById('overlay').setAttribute('aria-hidden','true');document.getElementById('overlay').innerHTML=''}
function overlay(html){const e=document.getElementById('overlay');e.className='overlay open';e.setAttribute('aria-hidden','false');e.innerHTML=html;e.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeOverlay);e.onclick=x=>{if(x.target===e)closeOverlay()};e.querySelector('[data-close]')?.focus()}
function source(id,tab='source'){const s=sources[id];overlay(`<section class="source-drawer" role="dialog" aria-modal="true" aria-labelledby="sourceTitle"><header class="drawerhead"><h2 id="sourceTitle">${s.title}</h2><button class="close" aria-label="关闭原文" data-close>${icon('close')}</button></header><div class="sourcebody"><div class="version">档案管理 / LIS 系统交付资料<br>${s.version} · ${s.date} · ${s.where}</div><div class="dtabs"><button class="${tab==='source'?'active':''}" data-tab="source">原文</button><button class="${tab==='markdown'?'active':''}" data-tab="markdown">Markdown</button><button class="${tab==='summary'?'active':''}" data-tab="summary">整理摘要</button></div>${tab==='markdown'?`<pre># ${s.title}\n\n来源：${s.file}\n版本：${s.version}\n定位：${s.where}\n\n${s.text}\n\n${s.note}</pre>`:`<h3>${tab==='summary'?'整理摘要':s.title}</h3><p>${s.text}</p><blockquote>${s.note}</blockquote>`}<button class="secondary" data-back>在档案中查看</button></div></section>`);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>source(id,b.dataset.tab));document.querySelector('[data-back]').onclick=()=>{closeOverlay();page('archives')}}
function upload(){overlay(`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle"><div class="dialogrow"><h2 id="uploadTitle">上传附件</h2><button class="close" aria-label="关闭上传" data-close>${icon('close')}</button></div><p>保存后自动作为资料整理到知识库。</p><div class="upload-area">${icon('upload')}<br>月度巡检补充说明.docx<br><small>演示文件 · 246 KB</small></div><div class="modalfooter"><button class="secondary" data-close>取消</button><button class="secondary primary" id="demoUpload">演示上传</button></div></section>`);document.getElementById('demoUpload').onclick=()=>{state.uploaded=true;closeOverlay();render();toast('演示：附件已保存，原文可检索，摘要整理中')}}
function about(){overlay('<section class="modal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle"><h2 id="aboutTitle">静态原型 · 最小页面调整</h2><p>保留档案管理上传资料，AI 输入框底部通过“+”切换运维助手与资料问答。没有新增文档管理菜单或资料范围横条。</p><p>资料、回复和权限结果均为示例，未调用接口或模型，未实现正式鉴权。</p><div class="modalfooter"><button class="secondary primary" data-close>知道了</button></div></section>')}
document.addEventListener('click',e=>{if(state.menu&&!e.target.closest('.modes')&&!e.target.closest('#modePlus')){state.menu=false;const p=document.querySelector('.modes');if(p)p.remove();const b=document.getElementById('modePlus');if(b){b.classList.remove('open');b.setAttribute('aria-expanded','false')}}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.menu){state.menu=false;render();document.getElementById('modePlus')?.focus()}closeOverlay()}});render();
</script></body></html>
