<!doctype html>
<!-- Read-only, throwaway archive print prototype. Three A4 layouts on the same
     prototype route, selected with ?variant=A|B|C. No application API calls. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>档案信息打印 · 排版原型</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#171717;font:14px/1.65 "Noto Sans CJK SC","Microsoft YaHei",sans-serif}
    .tools{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d8dee6;padding:16px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between}
    .tools strong{font-size:17px}.tools small{display:block;color:#6b7280}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}button,select{font:inherit;background:#fff;border:1px solid #cbd2dd;border-radius:6px;padding:6px 12px;cursor:pointer}
    button.primary{background:#6550b9;border-color:#6550b9;color:#fff}.workspace{padding:30px 20px 110px}.sheet{width:210mm;min-height:297mm;background:white;padding:18mm;margin:0 auto;box-shadow:0 8px 36px #17234416;font-size:10.5pt;line-height:1.65}
    h1,h2,p{margin:0}h1{font-size:23pt;line-height:1.5;font-weight:600}h2{font-size:12pt}.muted{color:#555}.eyebrow{font-size:9pt;letter-spacing:1px}.small{font-size:9pt}.pre{white-space:pre-line;overflow-wrap:anywhere}.empty{color:#777}
    table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{padding:9px 11px;vertical-align:middle;overflow-wrap:anywhere}th{font-weight:500;text-align:center}thead{display:table-header-group}tr{break-inside:avoid}
    .a h1{text-align:center;letter-spacing:3px;margin:10px 0 18px}.a .form-meta{display:flex;justify-content:space-between;margin-bottom:10px;font-size:9pt}.a table{border:1.2px solid #333}.a th,.a td{border:1px solid #777}.a th{width:18%;background:#f4f4f4}.a td{width:32%}.a .long{padding-top:13px;padding-bottom:13px;line-height:1.9}.a .section{background:#e9e9e9;font-weight:600;text-align:left;letter-spacing:1px;padding:7px 11px}.a .materials{margin-top:16px}.a .materials th{width:auto}.a .materials td{text-align:center}.a .materials td:nth-child(2){text-align:left}.a .record{border:1px solid #777;border-top:0;padding:9px 11px;font-size:9pt;display:flex;justify-content:space-between;gap:14px}
    .b .topline{display:flex;justify-content:space-between;border-bottom:2px solid #222;padding-bottom:12px}.b h1{margin:30px 0 12px;max-width:95%;font-size:25pt}.b .summary{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #aaa;color:#444}.b .section-title{display:flex;gap:16px;align-items:center;margin:25px 0 12px}.b .number{font-size:23pt;font-family:Georgia,serif;color:#888;line-height:1}.b .rule{flex:1;height:1px;background:#aaa}.b dl{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px;margin:0}.b dt{font-size:9pt;color:#666;margin-bottom:3px}.b dd{margin:0;min-height:22px;font-size:11pt}.b .wide{grid-column:1/-1}.b .body-copy{line-height:1.95}.b .file{display:flex;justify-content:space-between;border-bottom:1px dotted #aaa;padding:9px 0;gap:16px}.b footer{margin-top:35px;border-top:1px solid #777;padding-top:12px;font-size:9pt;display:flex;justify-content:space-between}
    .c .masthead{display:grid;grid-template-columns:1fr 30mm;border-bottom:3px double #333;gap:15px;padding-bottom:14px}.c h1{font-size:21pt;margin-top:8px}.c .stamp{border:1px solid #555;align-self:center;text-align:center;padding:8px;font-size:11pt}.c .subject{font-size:14pt;font-weight:600;margin:18px 0 16px}.c .columns{display:grid;grid-template-columns:44mm 1fr;gap:20px}.c aside{border-right:1px solid #aaa;padding-right:18px}.c .item{margin-bottom:17px;break-inside:avoid}.c .key{font-size:9pt;color:#666}.c .value{margin-top:3px}.c h2{padding-bottom:7px;border-bottom:1px solid #888;margin-bottom:13px}.c .text-block{margin-bottom:24px;line-height:1.95}.c .register{margin-top:24px;border-top:2px solid #555}.c .register td{padding:8px 0;border-bottom:1px solid #ccc}.c .register td:first-child{width:10mm}.c .register td:last-child{width:30mm;text-align:right}.c footer{margin-top:28px;border-top:1px solid #888;padding-top:12px;color:#555;font-size:9pt}
    .endnote{margin-top:14px;font-size:8.5pt;color:#666}.switcher{position:fixed;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#222b3d;color:white;border-radius:40px;padding:8px 12px;box-shadow:0 6px 24px #1114}.switcher button{color:white;border:0;background:none;border-radius:24px;padding:8px 14px}.switcher button.active{background:#fff;color:#252537}.switcher .arrow{font-size:21px;line-height:1;padding:8px}.state{text-align:center;color:#626b7a;font-size:12px;margin-bottom:18px}
    @page{size:A4;margin:18mm;@bottom-center{content:"第 " counter(page) " 页 / 共 " counter(pages) " 页";font:9pt sans-serif;color:#666}}
    @media print{body{background:white}.tools,.switcher,.state{display:none!important}.workspace{padding:0}.sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}th,.section{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
    @media(max-width:860px){.tools{position:relative;flex-wrap:wrap}.sheet{margin-left:0}.workspace{overflow:auto}.controls{gap:8px}.switcher{width:max-content;max-width:96vw;gap:0}.switcher button{padding:8px}.switcher .arrow{padding:7px}}
  </style>
</head>
<body>
  <header class="tools">
    <div><strong>档案信息打印 · 排版原型</strong><small>虚构样本，只读预览。A 版已选定，保留样稿供排版对照。</small></div>
    <div class="controls">
      <label>档案类别 <select id="category"><option value="training">培训服务</option><option value="inspection">巡检报告</option><option value="incident">故障报告</option><option value="other">其他文档</option></select></label>
      <label><input id="long" type="checkbox"> 长内容样本</label>
      <button class="primary" onclick="window.print()">打印样张</button>
    </div>
  </header>
  <div class="workspace"><div id="state" class="state"></div><main id="sheet" class="sheet"></main></div>
  <nav class="switcher" aria-label="打印原型方案"><button class="arrow" id="prev" aria-label="上一方案">‹</button><button data-variant="A">A · OA 表格式</button><button data-variant="B">B · 分区报告式</button><button data-variant="C">C · 紧凑归档式</button><button class="arrow" id="next" aria-label="下一方案">›</button></nav>
  <script>
    const samples={
      training:{name:'培训服务',form:'培训服务档案表',title:'监控告警处置与值班交接培训',id:'PX-2026-0018',fields:[['培训部门','基础设施组'],['培训状态','正常'],['培训开始时间','2026-10-24 09:00'],['培训结束时间','2026-10-24 11:00'],['培训地点','研发楼 301 培训室'],['培训时长','2 小时'],['培训讲师','林老师（测试）'],['参加人员','测试学员甲、乙、丙']],texts:[['培训内容','1. 指标查询及告警分级：理解触发、持续、恢复的完整过程。\n2. 值班处置演练：检查告警上下文，记录影响及处理过程。\n3. 交接要求：核对未恢复告警、待办事项和下一步处理人。'],['培训效果','三位学员完成模拟处置并提交演练记录。告警判断与交接记录符合培训要求；恢复通知的核对步骤需在下一次培训中复习。']],files:[['监控告警处置培训讲义','在线文档','v2'],['参会人员签到表.png','图片','v1']]},
      inspection:{name:'巡检报告',form:'设备巡检档案表',title:'机房交换机链路异常复查',id:'XJ-2026-0032',fields:[['巡检结果','异常'],['处理人','王工（测试）'],['巡检设备范围','网络、交换机'],['创建时间','2026-10-24 14:30']],texts:[['巡检总结','现象：测试接入交换机端口出现间歇丢包。\n初步判断：跳线接触不良，设备电源及温度正常。\n处理计划：更换跳线，检查接口误码，并连续观察 24 小时。\n当前结论：待复查，补充后续处理记录。']],files:[['交换机链路巡检报告','在线文档','v3'],['接口状态截图.png','图片','v1']]},
      incident:{name:'故障报告',form:'故障处理档案表',title:'订单查询响应延迟故障',id:'GZ-2026-0007',fields:[['故障等级','Ⅲ级'],['影响业务','订单查询服务（测试业务）'],['故障发生时间','2026-10-23 14:10'],['故障解决时间','2026-10-23 14:48'],['主要处理工程师','赵工（测试）'],['辅助处理工程师','钱工、孙工（测试）']],texts:[],files:[['订单查询延迟故障报告.docx','Word','v2'],['故障处置时间线.pdf','PDF','v1']]},
      other:{name:'其他文档',form:'业务文档归档表',title:'值班交接操作指引',id:'WD-2026-0025',fields:[['文档类型','运维手册'],['文档状态','已归档']],texts:[['说明','交接前核对未恢复告警、待办事项和维护窗口；交接记录需包含值班人、时间、影响范围及下一步动作。本文为虚构演示资料。']],files:[['值班交接操作指引','在线文档','v4'],['交接记录示例.pdf','PDF','v1']]}
    };
    const names={A:'OA 表格式',B:'分区报告式',C:'紧凑归档式'};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const record='制表账号：Admin　　最后更新：2026-10-26 10:30';
    function variantA(s){let rows='';for(let i=0;i<s.fields.length;i+=2){const a=s.fields[i],b=s.fields[i+1];rows+=`<tr><th>${esc(a[0])}</th><td>${esc(a[1])}</td>${b?`<th>${esc(b[0])}</th><td>${esc(b[1])}</td>`:'<th></th><td></td>'}</tr>`}return `<div class="eyebrow">运维服务档案 / ${s.name}</div><h1>${s.form}</h1><div class="form-meta"><span>档案编号：${s.id}</span><span>状态：已归档　版本：v9</span></div><table><colgroup><col style="width:18%"><col style="width:32%"><col style="width:18%"><col style="width:32%"></colgroup><tbody><tr><th>档案主题</th><td colspan="3">${s.title}</td></tr>${rows}${s.texts.map(t=>`<tr><th>${t[0]}</th><td colspan="3" class="long pre">${esc(t[1])}</td></tr>`).join('')}</tbody></table><table class="materials"><colgroup><col style="width:9%"><col style="width:57%"><col style="width:20%"><col style="width:14%"></colgroup><thead><tr><th colspan="4" class="section">留档资料清单</th></tr><tr><th style="width:9%">序号</th><th style="width:57%">资料名称</th><th style="width:20%">格式</th><th style="width:14%">版本</th></tr></thead><tbody>${s.files.map((f,i)=>`<tr><td>${i+1}</td><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join('')}</tbody></table><div class="record"><span>创建账号：Admin</span><span>最后更新：2026-10-26 10:30</span></div><p class="endnote">本表为档案基本信息。文档正文与附件内容不在本表内。</p>`}
    function variantB(s){return `<div class="topline"><span class="eyebrow">运维服务档案 · ${s.name}</span><span class="small">${s.id} / v9</span></div><h1>${s.title}</h1><p class="summary">${s.form}　·　已归档　·　创建账号 Admin</p><div class="section-title"><span class="number">01</span><h2>业务信息</h2><span class="rule"></span></div><dl>${s.fields.map(f=>`<div><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join('')}</dl>${s.texts.map((t,i)=>`<div class="section-title"><span class="number">0${i+2}</span><h2>${t[0]}</h2><span class="rule"></span></div><p class="body-copy pre">${esc(t[1])}</p>`).join('')}<div class="section-title"><span class="number">0${s.texts.length+2}</span><h2>留档资料</h2><span class="rule"></span></div>${s.files.map((f,i)=>`<div class="file"><span>${String(i+1).padStart(2,'0')}　${f[0]}</span><span class="small muted">${f[1]} · ${f[2]}</span></div>`).join('')}<footer><span>${record}</span><span>档案基本信息</span></footer>`}
    function variantC(s){const midpoint=Math.ceil(s.fields.length/2);return `<div class="masthead"><div><div class="eyebrow">业务留档 / ${s.id}</div><h1>${s.form}</h1></div><div class="stamp">已归档<br><span class="small">档案版本 v9</span></div></div><p class="subject">${s.title}</p><div class="columns"><aside>${s.fields.slice(0,midpoint).map(f=>`<div class="item"><div class="key">${f[0]}</div><div class="value">${f[1]}</div></div>`).join('')}<div class="item"><div class="key">创建账号</div><div class="value">Admin</div></div></aside><section><h2>业务记录</h2>${s.fields.slice(midpoint).map(f=>`<div class="item"><div class="key">${f[0]}</div><div class="value">${f[1]}</div></div>`).join('')}${s.texts.map(t=>`<div class="text-block"><h2>${t[0]}</h2><p class="pre">${esc(t[1])}</p></div>`).join('')}</section></div><table class="register"><thead><tr><td colspan="3"><strong>资料登记</strong></td></tr></thead><tbody>${s.files.map((f,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td>${f[0]}</td><td>${f[1]} · ${f[2]}</td></tr>`).join('')}</tbody></table><footer>${record}<br>本表记录业务信息，附件正文单独阅读或下载。</footer>`}
    function render(){const p=new URLSearchParams(location.search),v=names[p.get('variant')]?p.get('variant'):'A',category=samples[p.get('category')]?p.get('category'):'training',long=p.get('long')==='1';const s=structuredClone(samples[category]);if(long){if(!s.texts.length)s.texts.push(['补充说明','故障报告正文保留在资料中，本栏仅演示基本信息较长时的排版。']);s.texts[0][1]+='\n\n'+Array.from({length:6},(_,i)=>`补充记录 ${i+1}：核对过程、影响范围与处理结论，记录后续待办，确保留档内容可追溯。`).join('\n');for(let i=0;i<6;i++)s.files.push([`补充演练记录 ${i+1}.pdf`,'PDF','v1'])}document.getElementById('sheet').className=`sheet ${v.toLowerCase()}`;document.getElementById('sheet').innerHTML=({A:variantA,B:variantB,C:variantC}[v])(s);document.getElementById('category').value=category;document.getElementById('long').checked=long;document.getElementById('state').textContent=`当前方案 ${v} · ${names[v]}　｜　${s.name}　｜　${long?'长内容':'常规内容'}　｜　A4 纵向 · 18 mm 页边距`;document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('active',b.dataset.variant===v);b.setAttribute('aria-current',String(b.dataset.variant===v))})}
    function set(k,v){const u=new URL(location.href);u.searchParams.set(k,v);history.replaceState(null,'',u);render()}
    function cycle(n){const keys=Object.keys(names),v=new URLSearchParams(location.search).get('variant')||'A';set('variant',keys[(keys.indexOf(v)+n+keys.length)%keys.length])}
    document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>set('variant',b.dataset.variant));document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('category').onchange=e=>set('category',e.target.value);document.getElementById('long').onchange=e=>set('long',e.target.checked?'1':'0');document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
    const development=location.protocol==='file:'||['localhost','127.0.0.1'].includes(location.hostname)||/^n9e-dev[0-9]\.zhiteng\.win$/.test(location.hostname);if(!development)document.querySelector('.switcher').style.display='none';render();
  </script>
</body>
</html>
